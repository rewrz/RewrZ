<!-- Step 2: Database Setup -->
<div class="text-center mb-6">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">数据库初始化</h2>
    <p class="text-gray-600">配置并创建数据库</p>
</div>

<form id="database-config-form">
    <div class="bg-gray-50 rounded-lg p-6 mb-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">
            <i class="fas fa-database text-gray-600 mr-2"></i>
            数据库配置
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">数据库类型</label>
                <select id="database-type" class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white">
                    <option value="sqlite">SQLite</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">数据库文件路径</label>
                <input type="text" id="database-path" value="./data/rewrz.db" class="w-full px-3 py-2 border border-gray-300 rounded-md">
            </div>
        </div>
        <p class="text-sm text-gray-600 mt-3">
            <i class="fas fa-info-circle mr-1"></i>
            RewrZ 使用 SQLite 数据库。您可以指定数据库文件的路径和名称。数据库文件将在点击"初始化数据库"按钮后创建。
        </p>
    </div>
</form>

<div id="database-init-results" class="mb-8">
    <!-- 初始化结果将在这里显示 -->
</div>

<div class="flex justify-between">
    <button type="button" 
            class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors"
            hx-get="/installer/step/1"
            hx-target="#installation-content"
            hx-swap="innerHTML">
        <i class="fas fa-arrow-left mr-2"></i>上一步
    </button>
    <button id="init-database-btn" 
            type="button" 
            class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
        <i class="fas fa-database mr-2"></i>初始化数据库
    </button>
    <button id="next-step-btn" 
            type="button" 
            class="px-6 py-2 bg-gray-300 text-gray-700 rounded-lg cursor-not-allowed" 
            disabled
            hx-get="/installer/step/3"
            hx-target="#installation-content"
            hx-swap="innerHTML">
        下一步<i class="fas fa-arrow-right ml-2"></i>
    </button>
</div>

<script>
    // 更新步骤指示器
    updateStepIndicator(2);
    
    // 数据库初始化按钮事件
    document.getElementById('init-database-btn').addEventListener('click', function() {
        const button = this;
        const nextBtn = document.getElementById('next-step-btn');
        const resultsContainer = document.getElementById('database-init-results');
        const databasePath = document.getElementById('database-path').value;
        
        // 禁用按钮并显示加载状态
        button.disabled = true;
        button.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>初始化中...';
        
        // 显示进度信息
        resultsContainer.innerHTML = `
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                <div class="flex items-center">
                    <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-600 mr-3"></div>
                    <span class="text-blue-800 font-medium">正在初始化数据库...</span>
                </div>
                <div class="mt-3 space-y-2">
                    <div class="text-sm text-blue-700">
                        <div class="flex items-center">
                            <div class="w-2 h-2 bg-blue-400 rounded-full mr-2 animate-pulse"></div>
                            创建数据库表结构
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        // 发送初始化请求，包含数据库路径
        fetch('/installer/initialize-database', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `database_path=${encodeURIComponent(databasePath)}`
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                resultsContainer.innerHTML = `
                    <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                        <div class="flex items-center">
                            <i class="fas fa-check-circle text-green-600 text-lg mr-3"></i>
                            <span class="font-semibold text-green-800">数据库初始化成功！</span>
                        </div>
                        <p class="text-green-700 text-sm mt-2">${data.message}</p>
                        <div class="mt-3 space-y-1 text-sm text-green-700">
                            <div class="flex items-center">
                                <i class="fas fa-check text-green-500 mr-2"></i>
                                数据库文件: ${databasePath}
                            </div>
                            <div class="flex items-center">
                                <i class="fas fa-check text-green-500 mr-2"></i>
                                数据库表创建完成
                            </div>
                            <div class="flex items-center">
                                <i class="fas fa-check text-green-500 mr-2"></i>
                                基础数据结构就绪
                            </div>
                        </div>
                    </div>
                `;
                
                // 启用下一步按钮
                nextBtn.disabled = false;
                nextBtn.className = 'px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors';
                
                // 隐藏初始化按钮
                button.style.display = 'none';
            } else {
                resultsContainer.innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                        <div class="flex items-center">
                            <i class="fas fa-times-circle text-red-600 text-lg mr-3"></i>
                            <span class="font-semibold text-red-800">数据库初始化失败</span>
                        </div>
                        <p class="text-red-700 text-sm mt-2">${data.error}</p>
                        <div class="mt-3">
                            <button class="text-sm bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700"
                                    onclick="location.reload()">
                                重试
                            </button>
                        </div>
                    </div>
                `;
                
                // 重新启用按钮
                button.disabled = false;
                button.innerHTML = '<i class="fas fa-database mr-2"></i>重新初始化';
            }
        })
        .catch(error => {
            console.error('数据库初始化失败:', error);
            resultsContainer.innerHTML = `
                <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                    <div class="flex items-center">
                        <i class="fas fa-times-circle text-red-600 text-lg mr-3"></i>
                        <span class="font-semibold text-red-800">网络错误</span>
                    </div>
                    <p class="text-red-700 text-sm mt-2">无法连接到服务器，请检查网络连接。</p>
                </div>
            `;
            
            // 重新启用按钮
            button.disabled = false;
            button.innerHTML = '<i class="fas fa-database mr-2"></i>重新初始化';
        });
    });
</script>
