<!-- Step 4: Site Configuration -->
<div class="text-center mb-6">
    <h2 class="text-2xl font-bold text-gray-900 mb-2">站点配置</h2>
    <p class="text-gray-600">设置您的博客基本信息和偏好</p>
</div>

<form id="site-config-form" class="space-y-6 mb-8">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    
    <!-- 基础信息 -->
    <div class="bg-gray-50 rounded-lg p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">
            <i class="fas fa-globe text-gray-600 mr-2"></i>
            基础信息
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="md:col-span-2">
                <label for="site_title" class="block text-sm font-medium text-gray-700 mb-1">
                    站点标题 <span class="text-red-500">*</span>
                </label>
                <input type="text" 
                       id="site_title" 
                       name="site_title" 
                       required 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500"
                       placeholder="我的博客"
                       value="RewrZ 博客">
                <p class="text-xs text-gray-500 mt-1">将显示在浏览器标题栏和站点头部</p>
            </div>
            <div class="md:col-span-2">
                <label for="tagline" class="block text-sm font-medium text-gray-700 mb-1">
                    站点副标题
                </label>
                <input type="text" 
                       id="tagline" 
                       name="tagline" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500"
                       placeholder="分享技术与生活"
                       value="一个功能强大的个人博客系统">
                <p class="text-xs text-gray-500 mt-1">简短描述您的博客主题或口号</p>
            </div>
            <div class="md:col-span-2">
                <label for="site_url" class="block text-sm font-medium text-gray-700 mb-1">
                    站点URL
                </label>
                <input type="url" 
                       id="site_url" 
                       name="site_url" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500"
                       placeholder="https://your-blog.com">
                <p class="text-xs text-gray-500 mt-1">完整的站点地址，用于SEO和社交分享（可稍后配置）</p>
            </div>
        </div>
    </div>
    
    <!-- 区域设置 -->
    <div class="bg-gray-50 rounded-lg p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">
            <i class="fas fa-map-marker-alt text-gray-600 mr-2"></i>
            区域设置
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="timezone" class="block text-sm font-medium text-gray-700 mb-1">
                    时区
                </label>
                <select id="timezone" 
                        name="timezone" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="Asia/Shanghai">亚洲/上海 (UTC+8)</option>
                    <option value="Asia/Beijing">亚洲/北京 (UTC+8)</option>
                    <option value="Asia/Hong_Kong">亚洲/香港 (UTC+8)</option>
                    <option value="Asia/Taipei">亚洲/台北 (UTC+8)</option>
                    <option value="UTC">协调世界时 (UTC+0)</option>
                    <option value="America/New_York">美洲/纽约 (UTC-5)</option>
                    <option value="Europe/London">欧洲/伦敦 (UTC+0)</option>
                    <option value="Asia/Tokyo">亚洲/东京 (UTC+9)</option>
                </select>
            </div>
            <div>
                <label for="language" class="block text-sm font-medium text-gray-700 mb-1">
                    语言
                </label>
                <select id="language" 
                        name="language" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="zh-CN">简体中文</option>
                    <option value="zh-TW">繁體中文</option>
                    <option value="en-US">English (US)</option>
                    <option value="ja-JP">日本語</option>
                </select>
            </div>
        </div>
    </div>
    
    <!-- 高级选项 -->
    <div class="bg-gray-50 rounded-lg p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">
            <i class="fas fa-cogs text-gray-600 mr-2"></i>
            高级选项
        </h3>
        <div class="space-y-4">
            <div class="flex items-center">
                <input type="checkbox" 
                       id="enable_comments" 
                       name="enable_comments" 
                       checked
                       class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                <label for="enable_comments" class="ml-2 block text-sm text-gray-900">
                    启用评论系统
                </label>
            </div>
            <div class="flex items-center">
                <input type="checkbox" 
                       id="enable_registration" 
                       name="enable_registration" 
                       class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                <label for="enable_registration" class="ml-2 block text-sm text-gray-900">
                    允许用户注册
                </label>
            </div>
            <div class="flex items-center">
                <input type="checkbox" 
                       id="enable_seo" 
                       name="enable_seo" 
                       checked
                       class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                <label for="enable_seo" class="ml-2 block text-sm text-gray-900">
                    启用SEO优化功能
                </label>
            </div>
        </div>
        <p class="text-xs text-gray-500 mt-3">这些设置可以在管理后台随时修改</p>
    </div>
</form>

<div id="site-config-results" class="mb-6">
    <!-- 配置结果将在这里显示 -->
</div>

<div class="flex justify-between">
    <button type="button" 
            class="px-6 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors"
            hx-get="/installer/step/3"
            hx-target="#installation-content"
            hx-swap="innerHTML">
        <i class="fas fa-arrow-left mr-2"></i>上一步
    </button>
    <button id="save-config-btn" 
            type="button" 
            class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
        <i class="fas fa-save mr-2"></i>保存配置
    </button>
    <button id="next-step-btn" 
            type="button" 
            class="px-6 py-2 bg-gray-300 text-gray-700 rounded-lg cursor-not-allowed" 
            disabled>
        下一步<i class="fas fa-arrow-right ml-2"></i>
    </button>
</div>

<script>
    // 更新步骤指示器
    updateStepIndicator(4);
    
    // 保存配置按钮事件
    document.getElementById('save-config-btn').addEventListener('click', function() {
        const form = document.getElementById('site-config-form');
        const button = this;
        const nextBtn = document.getElementById('next-step-btn');
        const resultsContainer = document.getElementById('site-config-results');
        
        // 表单验证
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }
        
        // 禁用按钮并显示加载状态
        button.disabled = true;
        button.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>保存中...';
        
        // 显示进度信息
        resultsContainer.innerHTML = `
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                <div class="flex items-center">
                    <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-600 mr-3"></div>
                    <span class="text-blue-800 font-medium">正在保存站点配置...</span>
                </div>
            </div>
        `;
        
        // 准备表单数据
        const formData = new FormData(form);
        
        // 发送配置请求
        fetch('/installer/configure-site', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                resultsContainer.innerHTML = `
                    <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                        <div class="flex items-center">
                            <i class="fas fa-check-circle text-green-600 text-lg mr-3"></i>
                            <span class="font-semibold text-green-800">站点配置保存成功！</span>
                        </div>
                        <p class="text-green-700 text-sm mt-2">${data.message}</p>
                        <div class="mt-3 space-y-1 text-sm text-green-700">
                            <div class="flex items-center">
                                <i class="fas fa-check text-green-500 mr-2"></i>
                                站点标题: ${formData.get('site_title')}
                            </div>
                            <div class="flex items-center">
                                <i class="fas fa-check text-green-500 mr-2"></i>
                                时区: ${formData.get('timezone')}
                            </div>
                            <div class="flex items-center">
                                <i class="fas fa-check text-green-500 mr-2"></i>
                                语言: ${formData.get('language')}
                            </div>
                        </div>
                    </div>
                `;
                
                // 启用下一步按钮
                nextBtn.disabled = false;
                nextBtn.className = 'px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors';
                nextBtn.setAttribute('hx-get', '/installer/step/4.5');  // 指向后台路径配置步骤
                nextBtn.setAttribute('hx-target', '#installation-content');
                nextBtn.setAttribute('hx-swap', 'innerHTML');
                
                // 隐藏保存按钮
                button.style.display = 'none';
                
                // 禁用表单
                const inputs = form.querySelectorAll('input, select');
                inputs.forEach(input => input.disabled = true);
            } else {
                resultsContainer.innerHTML = `
                    <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                        <div class="flex items-center">
                            <i class="fas fa-times-circle text-red-600 text-lg mr-3"></i>
                            <span class="font-semibold text-red-800">配置保存失败</span>
                        </div>
                        <p class="text-red-700 text-sm mt-2">${data.error}</p>
                    </div>
                `;
                
                // 重新启用按钮
                button.disabled = false;
                button.innerHTML = '<i class="fas fa-save mr-2"></i>重新保存';
            }
        })
        .catch(error => {
            console.error('保存配置失败:', error);
            resultsContainer.innerHTML = `
                <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                    <div class="flex items-center">
                        <i class="fas fa-times-circle text-red-600 text-lg mr-3"></i>
                        <span class="font-semibold text-red-800">网络错误</span>
                    </div>
                    <p class="text-red-700 text-sm mt-2">无法连接到服务器，请检查网络连接。</p>
                </div>
            `;
            
            // 重新启用按钮
            button.disabled = false;
            button.innerHTML = '<i class="fas fa-save mr-2"></i>重新保存';
        });
    });
</script>
