<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请求错误 - 400 - {{ site_title }}</title>
    <link rel="stylesheet" href="{{ static_asset(request, 'vendor/font-awesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ static_asset(request, 'css/error-pages.css') }}">
</head>
<body>
    <div class="error-shell">
        <div class="error-card">
            <div class="error-content">
                <div class="error-badge">
                    <i class="fas fa-circle-exclamation"></i>
                    <span>400 请求错误</span>
                </div>
                <div class="error-icon warning">
                    <i class="fas fa-circle-exclamation"></i>
                </div>
                <h1 class="error-title">400 请求错误</h1>
                <p class="error-message">抱歉，您的请求格式或参数不正确，服务器无法继续处理。</p>
                <div class="error-meta">
                    <p><strong>请求路径：</strong>{{ request.url.path }}</p>
                    <p><strong>说明：</strong>请检查表单内容、链接参数或刷新后重试。</p>
                </div>
                <div class="error-actions">
                    <button type="button" onclick="history.back()" class="error-action primary">
                        <i class="fas fa-arrow-left"></i>
                        返回上一页
                    </button>
                    <a href="/" class="error-action secondary">
                        <i class="fas fa-home"></i>
                        返回首页
                    </a>
                </div>
                <p class="error-note">如果这是从表单提交进入的页面，请重新检查输入后再提交。</p>
            </div>
        </div>
    </div>
</body>
</html>
