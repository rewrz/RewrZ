<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器内部错误 - 500 - {{ site_title }}</title>
    <link rel="stylesheet" href="{{ static_asset(request, 'vendor/font-awesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ static_asset(request, 'css/error-pages.css') }}">
</head>
<body>
    <div class="error-shell">
        <div class="error-card">
            <div class="error-content">
                <div class="error-badge">
                    <i class="fas fa-server"></i>
                    <span>500 服务器内部错误</span>
                </div>
                <div class="error-icon neutral">
                    <i class="fas fa-server"></i>
                </div>
                <h1 class="error-title">500 服务器内部错误</h1>
                <p class="error-message">抱歉，服务器在处理请求时遇到了意外问题，请稍后再试。</p>
                <div class="error-meta">
                    <p><strong>请求路径：</strong>{{ request.url.path }}</p>
                    <p><strong>说明：</strong>这通常是临时性服务异常或内部逻辑错误导致。</p>
                </div>
                <div class="error-actions">
                    <button type="button" onclick="location.reload()" class="error-action primary">
                        <i class="fas fa-rotate-right"></i>
                        刷新页面
                    </button>
                    <a href="/" class="error-action secondary">
                        <i class="fas fa-home"></i>
                        返回首页
                    </a>
                </div>
                <p class="error-note">如果刷新后仍然出现，请稍后再试，或联系管理员检查服务日志。</p>
            </div>
        </div>
    </div>
</body>
</html>
