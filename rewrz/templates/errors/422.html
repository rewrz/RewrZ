<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请求验证错误 - 422 - {{ site_title }}</title>
    <link rel="stylesheet" href="{{ static_asset(request, 'vendor/font-awesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ static_asset(request, 'css/error-pages.css') }}">
</head>
<body>
    <div class="error-shell">
        <div class="error-card">
            <div class="error-content">
                <div class="error-badge">
                    <i class="fas fa-list-check"></i>
                    <span>422 请求验证错误</span>
                </div>
                <div class="error-icon warning">
                    <i class="fas fa-list-check"></i>
                </div>
                <h1 class="error-title">422 请求验证错误</h1>
                <p class="error-message">抱歉，请求中的字段未通过校验，服务器拒绝继续处理。</p>
                <div class="error-meta">
                    <p><strong>请求路径：</strong>{{ request.url.path }}</p>
                    <p><strong>说明：</strong>请核对必填项、字段格式和上传内容后再试。</p>
                </div>
                <div class="error-actions">
                    <button type="button" onclick="history.back()" class="error-action primary">
                        <i class="fas fa-arrow-left"></i>
                        返回上一页
                    </button>
                    <a href="/" class="error-action secondary">
                        <i class="fas fa-home"></i>
                        返回首页
                    </a>
                </div>
                <p class="error-note">通常这类错误与表单字段缺失、格式不正确或资源无效有关。</p>
            </div>
        </div>
    </div>
</body>
</html>
