<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - 404 - {{ site_title }}</title>
    <link rel="stylesheet" href="{{ static_asset(request, 'vendor/font-awesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ static_asset(request, 'css/error-pages.css') }}">
</head>
<body>
    <div class="error-shell">
        <div class="error-card">
            <div class="error-content">
                <div class="error-badge">
                    <i class="fas fa-compass"></i>
                    <span>404 页面未找到</span>
                </div>
                <div class="error-icon warning">
                    <i class="fas fa-question-circle"></i>
                </div>
                <h1 class="error-title">404 页面未找到</h1>
                <p class="error-message">抱歉，您访问的页面不存在，或者已经被移动到新的位置。</p>
                <div class="error-meta">
                    <p><strong>请求路径：</strong>{{ request.url.path }}</p>
                    <p><strong>说明：</strong>请检查地址是否输入正确，或从首页重新进入。</p>
                </div>
                <div class="error-actions">
                    <button type="button" onclick="history.back()" class="error-action primary">
                        <i class="fas fa-arrow-left"></i>
                        返回上一页
                    </button>
                    <a href="/" class="error-action secondary">
                        <i class="fas fa-home"></i>
                        返回首页
                    </a>
                </div>
                <p class="error-note">如果这是旧链接，请更新书签或从导航重新查找内容。</p>
            </div>
        </div>
    </div>
</body>
</html>
