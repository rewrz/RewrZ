<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问被禁止 - 403 - {{ site_title }}</title>
    <link rel="stylesheet" href="{{ static_asset(request, 'vendor/font-awesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ static_asset(request, 'css/error-pages.css') }}">
</head>
<body>
    <div class="error-shell">
        <div class="error-card">
            <div class="error-content">
                <div class="error-badge">
                    <i class="fas fa-ban"></i>
                    <span>403 访问被禁止</span>
                </div>
                <div class="error-icon warning">
                    <i class="fas fa-ban"></i>
                </div>
                <h1 class="error-title">403 访问被禁止</h1>
                <p class="error-message">抱歉，当前账户或访问来源没有权限查看这个页面。</p>
                <div class="error-meta">
                    <p><strong>请求路径：</strong>{{ request.url.path }}</p>
                    <p><strong>说明：</strong>请确认登录状态、账户权限或管理后台访问入口是否正确。</p>
                </div>
                <div class="error-actions">
                    <button type="button" onclick="history.back()" class="error-action primary">
                        <i class="fas fa-arrow-left"></i>
                        返回上一页
                    </button>
                    <a href="/" class="error-action secondary">
                        <i class="fas fa-home"></i>
                        返回首页
                    </a>
                </div>
                <p class="error-note">如果你认为这是误判，请联系管理员核查权限配置。</p>
            </div>
        </div>
    </div>
</body>
</html>
