{% extends "base.html" %}

{% block title %}受保护内容 - {{ post.title if post else site_title }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl px-4 py-16">
    <div class="rounded-xl border border-gray-200 bg-white p-8 shadow-sm">
        <h1 class="mb-3 text-2xl font-bold text-gray-900">内容受密码保护</h1>
        <p class="mb-6 text-sm text-gray-600">
            请输入访问密码以查看
            <span class="font-semibold text-gray-800">《{{ post.title if post else '该内容' }}》</span>
        </p>

        {% if error_message %}
        <div class="mb-4 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
            {{ error_message }}
        </div>
        {% endif %}

        <form method="post" action="/api/v1/posts/{{ post.id }}/unlock" class="space-y-4">
            <input type="hidden" name="next_url" value="{{ next_url or request.url.path }}">
            <div>
                <label for="password" class="mb-1 block text-sm font-medium text-gray-700">访问密码</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    class="w-full rounded-md border border-gray-300 px-3 py-2 shadow-sm focus:border-indigo-500 focus:outline-none"
                >
            </div>
            <button
                type="submit"
                class="w-full rounded-md bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700"
            >
                验证并查看
            </button>
        </form>
    </div>
</div>
{% endblock %}
