{% extends "base.html" %}

{% block title %}受保护内容 - {{ post.title if post else site_title }}{% endblock %}

{% block content %}
<div class="password-guard-shell mx-auto max-w-xl px-4 py-16">
    <div class="password-guard-card p-8">
        <h1 class="password-guard-title mb-3 text-2xl font-bold">内容受密码保护</h1>
        <p class="password-guard-copy mb-6 text-sm">
            请输入访问密码以查看
            <span class="password-guard-name font-semibold">《{{ post.title if post else '该内容' }}》</span>
        </p>

        {% if error_message %}
        <div class="password-guard-error mb-4 px-3 py-2 text-sm">
            {{ error_message }}
        </div>
        {% endif %}

        <form method="post" action="/api/v1/posts/{{ post.id }}/unlock" class="space-y-4">
            <input type="hidden" name="next_url" value="{{ next_url or request.url.path }}">
            <div>
                <label for="password" class="password-guard-label mb-1 block text-sm font-medium">访问密码</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    class="password-guard-input w-full px-3 py-2.5 shadow-sm focus:outline-none"
                >
            </div>
            <button
                type="submit"
                class="password-guard-submit w-full px-4 py-2.5"
            >
                验证并查看
            </button>
        </form>
    </div>
</div>
{% endblock %}
