{% extends "base.html" %}

{% block title %}受保护内容 - {{ post.title if post else site_title }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl px-4 py-16">
    <div class="password-guard-card rounded-3xl border border-gray-200 bg-white/90 p-8 shadow-xl backdrop-blur-md dark:bg-gray-800/85">
        <h1 class="mb-3 text-2xl font-bold text-gray-900 dark:text-white">内容受密码保护</h1>
        <p class="mb-6 text-sm text-gray-600 dark:text-gray-300">
            请输入访问密码以查看
            <span class="font-semibold text-gray-800 dark:text-gray-100">《{{ post.title if post else '该内容' }}》</span>
        </p>

        {% if error_message %}
        <div class="password-guard-error mb-4 rounded-2xl border border-red-200 bg-red-50/85 px-3 py-2 text-sm text-red-700">
            {{ error_message }}
        </div>
        {% endif %}

        <form method="post" action="/api/v1/posts/{{ post.id }}/unlock" class="space-y-4">
            <input type="hidden" name="next_url" value="{{ next_url or request.url.path }}">
            <div>
                <label for="password" class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-200">访问密码</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    required
                    class="password-guard-input w-full rounded-2xl border border-gray-300 px-3 py-2.5 shadow-sm focus:border-indigo-500 focus:outline-none"
                >
            </div>
            <button
                type="submit"
                class="password-guard-submit w-full rounded-2xl bg-indigo-600 px-4 py-2.5 text-white hover:bg-indigo-700"
            >
                验证并查看
            </button>
        </form>
    </div>
</div>
{% endblock %}
