<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RewrZ 管理后台{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex">
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-800 text-white p-4 space-y-6">
        <div class="text-2xl font-bold mb-6">RewrZ Admin</div>
        <nav>
            <a href="{{ request.state.admin_path }}/dashboard" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">仪表盘</a>
            <a href="{{ request.state.admin_path }}/posts/new" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">新建文章</a>
            <a href="#" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">文章管理</a>
            <a href="#" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">页面管理</a>
            <a href="#" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">分类管理</a>
            <a href="#" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">标签管理</a>
            <a href="#" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">评论管理</a>
            <a href="{{ request.state.admin_path }}/comments/settings" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">评论设置</a>
            <a href="{{ request.state.admin_path }}/media" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">媒体库</a>
            <a href="{{ request.state.admin_path }}/themes" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">主题管理</a>
            <a href="{{ request.state.admin_path }}/settings" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">设置</a>
            <a href="{{ request.state.admin_path }}/error-settings" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">
                <i class="fas fa-exclamation-triangle mr-2"></i>错误处理
            </a>
            <a href="{{ request.state.admin_path }}/system/info" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-gray-700">
                <i class="fas fa-server mr-2"></i>系统信息
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div id="admin-content" class="flex-1 p-10">
        <header class="flex justify-between items-center pb-6 border-b border-gray-200 mb-6">
            <h1 class="text-3xl font-semibold text-gray-800">{% block admin_header %}{% endblock %}</h1>
            <div class="flex items-center space-x-4">
                <span class="text-gray-700">欢迎, {{ user.username }}!</span>
                <a href="/auth/logout" class="text-indigo-600 hover:underline">退出</a>
            </div>
        </header>
        {% block admin_content %}{% endblock %}
    </div>
</body>
</html>
