<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_title }} 后台管理{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Custom styles for modern look and feel */
        body {
            font-family: 'Inter', sans-serif;
        }
        .nav-item {
            display: flex;
            align-items: center;
            padding: 0.625rem 1rem; /* 10px 16px */
            margin-top: 0.5rem; /* 8px */
            color: #D1D5DB; /* gray-300 */
            border-radius: 0.375rem; /* rounded-md */
            transition: background-color 0.2s, color 0.2s;
        }
        .nav-item:hover {
            background-color: #374151; /* gray-700 */
            color: #FFFFFF;
        }
        .nav-item.active {
            background-color: #4F46E5; /* indigo-600 */
            color: #FFFFFF;
        }
        .nav-item i {
            width: 1.5rem; /* w-6 */
            margin-right: 0.5rem; /* mr-2 */
        }
        .nav-group-title {
            padding-left: 1rem; /* px-4 */
            font-size: 0.75rem; /* text-xs */
            color: #9CA3AF; /* gray-500 */
            text-transform: uppercase;
            font-weight: 700; /* font-bold */
            margin-top: 1rem; /* mt-4 */
            margin-bottom: 0.5rem; /* mb-2 */
        }
        /* Responsive adjustments */
        @media (max-width: 768px) {
            aside {
                width: 100%;
                height: auto;
                position: relative;
            }
            #admin-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col md:flex-row">
    {% include 'admin/components/sidebar.html' %}

    <!-- Main Content -->
    <div id="admin-content" class="flex-1 p-4 md:p-10">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 md:pb-6 border-b border-gray-200 mb-4 md:mb-6">
            <h1 class="text-2xl md:text-3xl font-semibold text-gray-800 mb-2 md:mb-0">{% block page_title %}{% endblock %}</h1>
            <div class="flex items-center space-x-4">
                <span class="text-gray-700">欢迎, {{ user.username }}!</span>
                <a href="/auth/logout" class="text-indigo-600 hover:underline">退出</a>
            </div>
        </header>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
