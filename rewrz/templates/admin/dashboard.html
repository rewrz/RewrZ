{% extends "admin/base.html" %}

{% block title %}仪表盘 - {{ site_title }} 后台管理{% endblock %}

{% block page_title %}<i class="fas fa-tachometer-alt text-blue-600 mr-3"></i>仪表盘{% endblock %}

{% block content %}
<div>
    <div id="stats-container" 
         hx-get="{{ request.state.admin_path }}/api/dashboard/stats" 
         hx-trigger="load, every 30s" 
         hx-swap="innerHTML">
        <!-- 初始加载状态 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for i in range(6) %}
            <div class="bg-white p-6 rounded-lg shadow animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
                <div class="h-8 bg-gray-300 rounded w-1/2"></div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
