<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div class="admin-panel p-4 flex items-center">
        <div class="mr-3 h-11 w-11 rounded-xl bg-green-500 text-white inline-flex items-center justify-center">
            <i class="fas fa-check-circle"></i>
        </div>
        <div>
            <p class="text-xs text-gray-500">已发布文章</p>
            <p class="text-xl font-bold text-gray-800">{{ stats.published_posts }}</p>
        </div>
    </div>

    <div class="admin-panel p-4 flex items-center">
        <div class="mr-3 h-11 w-11 rounded-xl bg-yellow-500 text-white inline-flex items-center justify-center">
            <i class="fas fa-pencil-alt"></i>
        </div>
        <div>
            <p class="text-xs text-gray-500">草稿箱</p>
            <p class="text-xl font-bold text-gray-800">{{ stats.draft_posts }}</p>
        </div>
    </div>

    <div class="admin-panel p-4 flex items-center">
        <div class="mr-3 h-11 w-11 rounded-xl bg-blue-500 text-white inline-flex items-center justify-center">
            <i class="fas fa-comments"></i>
        </div>
        <div>
            <p class="text-xs text-gray-500">总评论数</p>
            <p class="text-xl font-bold text-gray-800">{{ stats.total_comments }}</p>
        </div>
    </div>

    <div class="admin-panel p-4 flex items-center">
        <div class="mr-3 h-11 w-11 rounded-xl bg-red-500 text-white inline-flex items-center justify-center">
            <i class="fas fa-hourglass-half"></i>
        </div>
        <div>
            <p class="text-xs text-gray-500">待审核评论</p>
            <p class="text-xl font-bold text-gray-800">{{ stats.pending_comments }}</p>
        </div>
    </div>

    <div class="admin-panel p-4 flex items-center">
        <div class="mr-3 h-11 w-11 rounded-xl bg-purple-500 text-white inline-flex items-center justify-center">
            <i class="fas fa-folder"></i>
        </div>
        <div>
            <p class="text-xs text-gray-500">分类总数</p>
            <p class="text-xl font-bold text-gray-800">{{ stats.total_categories }}</p>
        </div>
    </div>

    <div class="admin-panel p-4 flex items-center">
        <div class="mr-3 h-11 w-11 rounded-xl bg-indigo-500 text-white inline-flex items-center justify-center">
            <i class="fas fa-tags"></i>
        </div>
        <div>
            <p class="text-xs text-gray-500">标签总数</p>
            <p class="text-xl font-bold text-gray-800">{{ stats.total_tags }}</p>
        </div>
    </div>
</div>
