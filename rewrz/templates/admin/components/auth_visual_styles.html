<style>
    .admin-login-page {
        overflow: hidden;
        background: #090d1f;
    }
    .admin-login-stage {
        --login-parallax-x: 0px;
        --login-parallax-y: 0px;
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
    }
    .admin-login-bg-motion {
        position: absolute;
        inset: -4%;
        animation: loginBgDrift 34s ease-in-out infinite alternate;
    }
    .admin-login-bg {
        position: absolute;
        inset: 0;
        background-image:
            linear-gradient(125deg, rgba(10, 14, 30, 0.52), rgba(29, 40, 72, 0.42), rgba(64, 52, 148, 0.35)),
            url('{{ login_background_url }}');
        background-size: cover;
        background-position: center;
        transform: translate3d(var(--login-parallax-x), var(--login-parallax-y), 0) scale(1.08);
        filter: saturate(1.06) brightness(0.76) contrast(1.02);
        transition: transform 0.28s ease-out;
        will-change: transform;
    }
    .admin-login-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: translate3d(var(--login-parallax-x), var(--login-parallax-y), 0) scale(1.08);
        filter: saturate(1.04) brightness(0.72) contrast(1.02);
        transition: transform 0.28s ease-out;
        will-change: transform;
    }
    .admin-login-aurora {
        position: absolute;
        inset: -20%;
        background:
            radial-gradient(circle at 78% 18%, color-mix(in srgb, var(--color-primary) 34%, transparent), transparent 45%),
            radial-gradient(circle at 18% 76%, color-mix(in srgb, #ec4899 25%, transparent), transparent 46%),
            radial-gradient(circle at 52% 40%, color-mix(in srgb, #22d3ee 14%, transparent), transparent 58%);
        mix-blend-mode: screen;
        opacity: 0.44;
        filter: blur(12px);
        animation: auroraPulse 22s ease-in-out infinite alternate;
    }
    .admin-login-grid {
        position: absolute;
        inset: -25%;
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 44px 44px, 44px 44px;
        opacity: 0.1;
        transform: perspective(680px) rotateX(58deg);
        transform-origin: center top;
        animation: gridShift 28s linear infinite;
    }
    .admin-login-particles {
        position: absolute;
        inset: 0;
        overflow: hidden;
    }
    .admin-login-particles span {
        position: absolute;
        bottom: -12vh;
        left: var(--x);
        width: var(--size);
        height: var(--size);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        opacity: 0;
        animation: particleRise var(--duration) linear infinite;
        animation-delay: var(--delay);
    }
    @keyframes loginBgDrift {
        0% { transform: translate3d(-1.8%, -1.2%, 0) scale(1.06); }
        50% { transform: translate3d(1.2%, 1.4%, 0) scale(1.1); }
        100% { transform: translate3d(-0.7%, 0.9%, 0) scale(1.08); }
    }
    @keyframes auroraPulse {
        0% { transform: rotate(0deg) scale(1); filter: blur(10px) hue-rotate(0deg); opacity: 0.52; }
        100% { transform: rotate(8deg) scale(1.06); filter: blur(14px) hue-rotate(24deg); opacity: 0.7; }
    }
    @keyframes gridShift {
        0% { transform: perspective(680px) rotateX(58deg) translate3d(0, 0, 0); }
        100% { transform: perspective(680px) rotateX(58deg) translate3d(-44px, 44px, 0); }
    }
    @keyframes particleRise {
        0% { transform: translate3d(0, 0, 0) scale(0.8); opacity: 0; }
        12% { opacity: 0.62; }
        80% { opacity: 0.48; }
        100% { transform: translate3d(var(--drift), -118vh, 0) scale(1.15); opacity: 0; }
    }
    .login-deco-1 {
        position: fixed;
        top: 10%;
        right: 5%;
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, color-mix(in srgb, var(--color-primary) 14%, transparent), transparent 70%);
        border-radius: 50%;
        animation: decoFloat 14s ease-in-out infinite;
        pointer-events: none;
        z-index: 2;
    }
    .login-deco-2 {
        position: fixed;
        bottom: 15%;
        left: 8%;
        width: 150px;
        height: 150px;
        background: radial-gradient(circle, color-mix(in srgb, #8b5cf6 14%, transparent), transparent 70%);
        border-radius: 50%;
        animation: decoFloat 16s ease-in-out infinite reverse;
        pointer-events: none;
        z-index: 2;
    }
    .login-deco-3 {
        position: fixed;
        top: 60%;
        right: 15%;
        width: 100px;
        height: 100px;
        background: radial-gradient(circle, color-mix(in srgb, #ec4899 11%, transparent), transparent 70%);
        border-radius: 50%;
        animation: decoFloat 18s ease-in-out infinite;
        pointer-events: none;
        z-index: 2;
    }
    @keyframes decoFloat {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(20px, -20px) scale(1.1); }
    }
    .login-input-wrapper {
        position: relative;
    }
    .admin-login-card {
        background:
            linear-gradient(155deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.025) 18%, rgba(4, 8, 20, 0.58) 100%),
            rgba(9, 12, 24, 0.46) !important;
        backdrop-filter: blur(24px) saturate(1.18);
        -webkit-backdrop-filter: blur(24px) saturate(1.18);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow:
            0 28px 72px -22px rgba(5, 8, 20, 0.86),
            0 18px 48px -30px rgba(0, 0, 0, 0.78),
            inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .admin-login-card::after {
        content: '';
        position: absolute;
        inset: 1px;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, 0.08);
        pointer-events: none;
    }
    .admin-login-card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background:
            radial-gradient(circle at top left, rgba(255, 255, 255, 0.13), transparent 24%),
            linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 16%);
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0.86;
    }
    .admin-login-logo-mark {
        position: relative;
        width: 4.75rem;
        height: 4.75rem;
        border-radius: 1.55rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background:
            linear-gradient(145deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.06)),
            linear-gradient(135deg, color-mix(in srgb, var(--color-primary) 90%, #ffffff 10%), #0f766e 62%, #0f172a 100%);
        border: 1px solid rgba(255, 255, 255, 0.28);
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.3),
            0 18px 38px -18px rgba(15, 23, 42, 0.9);
        overflow: hidden;
    }
    .admin-login-logo-mark::before {
        content: '';
        position: absolute;
        inset: 8px;
        border-radius: 1.1rem;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent 54%);
    }
    .admin-login-logo-mark::after {
        content: '';
        position: absolute;
        width: 130%;
        height: 130%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.18), transparent 52%);
        top: -35%;
        right: -35%;
    }
    .admin-login-logo-text {
        position: relative;
        z-index: 1;
        display: inline-flex;
        align-items: center;
        font-size: 1.52rem;
        line-height: 1;
        letter-spacing: 0.14em;
        font-weight: 800;
        text-shadow: 0 3px 12px rgba(15, 23, 42, 0.45);
    }
    .admin-login-logo-text .logo-r {
        color: rgba(10, 10, 10, 0.96);
    }
    .admin-login-logo-text .logo-z {
        color: rgba(255, 255, 255, 0.98);
    }
    .admin-login-brand-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        padding: 0.4rem 0.7rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.88);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        backdrop-filter: blur(14px);
    }
    .admin-login-brand-chip .brand-dot {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 999px;
        background: color-mix(in srgb, var(--color-primary) 78%, #ffffff 22%);
        box-shadow: 0 0 10px color-mix(in srgb, var(--color-primary) 48%, transparent);
    }
    .login-input-wrapper .field-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--color-text-muted);
        transition: color 0.3s ease;
    }
    .login-input-wrapper input:focus ~ .field-icon {
        color: var(--color-primary);
    }
    .login-error-shake {
        animation: shake 0.5s ease-in-out;
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-5px); }
        40%, 80% { transform: translateX(5px); }
    }
    .password-toggle {
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--color-text-muted);
        cursor: pointer;
        padding: 0.25rem;
        transition: color 0.3s ease;
    }
    .password-toggle:hover {
        color: var(--color-primary);
    }
    .admin-login-input {
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.1),
            0 10px 28px -24px rgba(15, 23, 42, 0.95);
    }
    .admin-login-btn {
        border-radius: 1rem;
        background: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
        box-shadow:
            0 18px 32px -20px rgba(219, 39, 119, 0.62),
            inset 0 1px 0 rgba(255, 255, 255, 0.22);
        transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }
    .admin-login-btn:hover {
        transform: translateY(-1px);
        box-shadow:
            0 22px 36px -18px rgba(219, 39, 119, 0.72),
            inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }
    @media (prefers-reduced-motion: reduce) {
        .admin-login-bg-motion,
        .admin-login-aurora,
        .admin-login-grid,
        .admin-login-particles span,
        .login-deco-1,
        .login-deco-2,
        .login-deco-3 {
            animation: none !important;
        }
    }
</style>
