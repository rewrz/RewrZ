<style>
/* 编辑器媒体库弹窗：配色统一收口到动态主题变量，随后台主题切换。 */
/* 遮罩为中性明暗蒙层，不参与主题配色。 */
.mlm-backdrop { background: rgba(0, 0, 0, 0.5); }
.mlm-panel { background: var(--color-card-bg); color: var(--color-text); }
.mlm-header, .mlm-tabs { border-bottom: 1px solid var(--color-border); }
.mlm-title { color: var(--color-text); }
.mlm-muted, .mlm-label { color: var(--color-text-light); }
.mlm-icon-btn { color: var(--color-text-light); }
.mlm-icon-btn:hover { background: var(--color-background-alt); color: var(--color-text); }
.mlm-tab { border-bottom: 2px solid transparent; color: var(--color-text-light); }
.mlm-tab:hover { color: var(--color-text); }
.mlm-tab.is-active { border-bottom-color: var(--color-primary); color: var(--color-primary); }
.mlm-grid { border: 1px solid var(--color-border); background: color-mix(in srgb, var(--color-background-alt) 28%, var(--color-card-bg) 72%); }
.mlm-card { border: 1px solid var(--color-border); background: var(--color-card-bg); }
.mlm-card:hover { box-shadow: 0 10px 22px -16px color-mix(in srgb, var(--color-primary) 55%, transparent); }
.mlm-card.is-selected { outline: 2px solid var(--color-primary); outline-offset: -2px; }
.mlm-card-title { color: var(--color-text); }
.mlm-placeholder { background: color-mix(in srgb, var(--color-background-alt) 78%, var(--color-card-bg) 22%); color: var(--color-text-light); }
.mlm-preview { border: 1px solid var(--color-border); }
.mlm-drop-area { border: 2px dashed var(--color-border); }
.mlm-drop-area:hover, .mlm-drop-area.is-dragover { border-color: var(--color-primary); background: color-mix(in srgb, var(--color-primary) 10%, var(--color-card-bg) 90%); }
.mlm-status { background: var(--color-background-alt); color: var(--color-text-light); }
.mlm-error { background: color-mix(in srgb, var(--color-primary) 10%, var(--color-card-bg) 90%); color: color-mix(in srgb, var(--color-primary) 70%, var(--color-text) 30%); }
</style>
<div id="media-library-modal" class="mlm-backdrop fixed inset-0 z-50 hidden p-4">
    <div class="mlm-panel mx-auto mt-8 w-full max-w-5xl rounded-lg shadow-xl">
        <div class="mlm-header flex items-center justify-between px-5 py-4">
            <h3 class="mlm-title text-lg font-semibold">媒体库</h3>
            <button type="button" id="media-lib-close-btn" class="mlm-icon-btn rounded p-2">
                <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                </svg>
            </button>
        </div>

        <div class="px-5 pb-5 pt-4">
            <div class="mlm-tabs mb-4">
                <nav class="-mb-px flex gap-4">
                    <button type="button" id="media-lib-tab-library" class="mlm-tab is-active px-1 py-2 text-sm font-medium">媒体库</button>
                    <button type="button" id="media-lib-tab-upload" class="mlm-tab px-1 py-2 text-sm font-medium">上传文件</button>
                </nav>
            </div>

            <section id="media-lib-panel-library" class="space-y-4">
                <div class="flex flex-wrap gap-2">
                    <input type="text" id="media-lib-search-input" placeholder="按标题或文件名搜索..." class="admin-form-field min-w-0 w-full sm:w-auto sm:flex-1 rounded-md px-3 py-2 text-sm">
                    <select id="media-lib-folder-filter" class="admin-form-field min-w-0 w-full sm:w-44 rounded-md px-2 py-2 text-sm"></select>
                    <button type="button" id="media-lib-search-btn" class="admin-primary-btn shrink-0 rounded-md px-4 py-2 text-sm font-medium">搜索</button>
                </div>

                <div id="media-lib-grid" class="mlm-grid grid max-h-96 grid-cols-1 min-[420px]:grid-cols-2 gap-3 overflow-y-auto rounded-md p-3 md:grid-cols-4">
                    <div id="media-lib-loading" class="mlm-muted col-span-full py-8 text-center text-sm">加载中...</div>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                    <button type="button" id="media-lib-load-more-btn" class="admin-secondary-btn hidden rounded-md px-3 py-2 text-sm">加载更多</button>
                    <div class="ml-auto flex items-center gap-2">
                        <div id="media-lib-size-options" class="hidden items-center gap-2">
                        <label for="media-lib-size-select" class="mlm-label text-xs">图片尺寸</label>
                        <select id="media-lib-size-select" class="admin-form-field rounded-md px-2 py-2 text-sm">
                            <option value="">原始尺寸</option>
                            <option value="md-img-xs">小（240px）</option>
                            <option value="md-img-sm">中（360px）</option>
                            <option value="md-img-md">大（560px）</option>
                            <option value="md-img-lg">特大（800px）</option>
                            <option value="md-img-full">通栏</option>
                        </select>
                        </div>
                        <button type="button" id="media-lib-select-btn" class="admin-primary-btn rounded-md px-4 py-2 text-sm font-medium disabled:cursor-not-allowed disabled:opacity-50" disabled>插入选中项</button>
                    </div>
                </div>
            </section>

            <section id="media-lib-panel-upload" class="hidden space-y-4">
                <div>
                    <label for="media-lib-upload-folder-select" class="mlm-label mb-1 block text-xs">上传到文件夹</label>
                    <select id="media-lib-upload-folder-select" class="admin-form-field w-full rounded-md px-3 py-2 text-sm"></select>
                </div>
                <div id="media-lib-drop-area" class="mlm-drop-area cursor-pointer rounded-md p-8 text-center">
                    <input type="file" id="media-lib-file-input" multiple class="hidden">
                    <p class="text-sm">拖拽文件到此处，或点击选择</p>
                    <p class="mlm-muted mt-1 text-xs">支持图片、视频、音频和常见文档</p>
                </div>

                <div id="media-lib-upload-status" class="mlm-status hidden rounded-md p-3 text-sm"></div>
                <div id="media-lib-uploaded-preview" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
            </section>
        </div>
    </div>
</div>

<script>
(() => {
    const adminPath = "{{ request.state.admin_path }}";
    const csrfToken = "{{ request.state.csrf_token }}";

    const modal = document.getElementById("media-library-modal");
    if (!modal) return;

    const elements = {
        closeBtn: document.getElementById("media-lib-close-btn"),
        tabLibrary: document.getElementById("media-lib-tab-library"),
        tabUpload: document.getElementById("media-lib-tab-upload"),
        panelLibrary: document.getElementById("media-lib-panel-library"),
        panelUpload: document.getElementById("media-lib-panel-upload"),
        searchInput: document.getElementById("media-lib-search-input"),
        folderFilter: document.getElementById("media-lib-folder-filter"),
        uploadFolderSelect: document.getElementById("media-lib-upload-folder-select"),
        searchBtn: document.getElementById("media-lib-search-btn"),
        grid: document.getElementById("media-lib-grid"),
        loading: document.getElementById("media-lib-loading"),
        loadMoreBtn: document.getElementById("media-lib-load-more-btn"),
        selectBtn: document.getElementById("media-lib-select-btn"),
        sizeOptions: document.getElementById("media-lib-size-options"),
        sizeSelect: document.getElementById("media-lib-size-select"),
        dropArea: document.getElementById("media-lib-drop-area"),
        fileInput: document.getElementById("media-lib-file-input"),
        uploadStatus: document.getElementById("media-lib-upload-status"),
        uploadedPreview: document.getElementById("media-lib-uploaded-preview"),
    };

    const state = {
        selectedItem: null,
        selectedItemId: null,
        selectedCardEl: null,
        page: 1,
        perPage: 24,
        hasMore: false,
        loading: false,
        onSelect: null,
        folders: [],
        itemIndex: new Map(),
        imageObserver: null,
        hasBootstrapped: false,
        lastLoadedAt: 0,
        scrollLoadScheduled: false,
    };
    const DATA_CACHE_TTL_MS = 60000;
    const RENDER_CHUNK_SIZE = 8;
    const SCROLL_LOAD_THRESHOLD_PX = 140;
    const MAX_RENDERED_MEDIA_ITEMS = 240;
    const TRIMMED_MEDIA_ITEMS = 180;

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function switchTab(tabName) {
        const isLibrary = tabName === "library";
        elements.panelLibrary.classList.toggle("hidden", !isLibrary);
        elements.panelUpload.classList.toggle("hidden", isLibrary);
        elements.tabLibrary.classList.toggle("is-active", isLibrary);
        elements.tabUpload.classList.toggle("is-active", !isLibrary);
    }

    function clearSelection() {
        state.selectedItem = null;
        state.selectedItemId = null;
        if (state.selectedCardEl && state.selectedCardEl.isConnected) {
            state.selectedCardEl.classList.remove("is-selected");
        }
        state.selectedCardEl = null;
        elements.selectBtn.disabled = true;
    }

    function setSelectionByCard(card) {
        const itemId = String(card?.dataset?.id || "");
        if (!itemId) return;
        const item = state.itemIndex.get(itemId);
        if (!item) return;

        if (state.selectedCardEl && state.selectedCardEl !== card && state.selectedCardEl.isConnected) {
            state.selectedCardEl.classList.remove("is-selected");
        }
        state.selectedItem = item;
        state.selectedItemId = itemId;
        state.selectedCardEl = card;
        card.classList.add("is-selected");
        elements.selectBtn.disabled = false;
    }

    function trimRenderedMediaItems() {
        const cards = elements.grid.querySelectorAll(".media-lib-item");
        if (cards.length <= MAX_RENDERED_MEDIA_ITEMS) return;
        let removeCount = cards.length - TRIMMED_MEDIA_ITEMS;
        cards.forEach((card) => {
            if (removeCount <= 0) return;
            if (state.selectedCardEl === card) return;
            const img = card.querySelector("img[data-src]");
            if (img && state.imageObserver) {
                state.imageObserver.unobserve(img);
            }
            const mediaId = String(card.dataset.id || "");
            if (mediaId) {
                state.itemIndex.delete(mediaId);
            }
            card.remove();
            removeCount -= 1;
        });
    }

    function ensureImageObserver() {
        if (state.imageObserver || typeof IntersectionObserver === "undefined") return;
        state.imageObserver = new IntersectionObserver(
            (entries, observer) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;
                    const img = entry.target;
                    const nextSrc = img.dataset.src || "";
                    if (!nextSrc) return;
                    if (img.dataset.loaded !== "1") {
                        img.src = nextSrc;
                        img.dataset.loaded = "1";
                    }
                    observer.unobserve(img);
                });
            },
            {
                root: elements.grid,
                rootMargin: "80px 0px",
                threshold: 0.01,
            },
        );
    }

    function observeLazyImage(img) {
        if (!img) return;
        const nextSrc = img.dataset.src || "";
        if (!nextSrc) return;

        if (typeof IntersectionObserver === "undefined") {
            img.src = nextSrc;
            img.dataset.loaded = "1";
            return;
        }

        ensureImageObserver();
        if (state.imageObserver) {
            state.imageObserver.observe(img);
        }
    }

    function renderFolderOptions() {
        const folderOptions = Array.isArray(state.folders) ? state.folders : [];
        const libraryOptions = [{ path: "__all__", name: "全部文件夹", count: null }].concat(
            folderOptions.filter((item) => item.path !== "__all__")
        );
        const uploadOptions = [{ path: "", name: "根目录", count: null }].concat(
            folderOptions.filter((item) => item.path !== "__all__" && item.path !== "")
        );

        const fillSelect = (el, options) => {
            if (!el) return;
            const oldValue = el.value;
            el.innerHTML = "";
            options.forEach((item) => {
                const option = document.createElement("option");
                option.value = item.path;
                option.textContent = `${item.name}${typeof item.count === "number" ? ` (${item.count})` : ""}`;
                el.appendChild(option);
            });
            if (Array.from(el.options).some((opt) => opt.value === oldValue)) {
                el.value = oldValue;
            }
        };

        fillSelect(elements.folderFilter, libraryOptions);
        fillSelect(elements.uploadFolderSelect, uploadOptions);

        if (elements.folderFilter && !elements.folderFilter.value) {
            elements.folderFilter.value = "__all__";
        }
    }

    async function loadFolders() {
        try {
            const response = await fetch(`${adminPath}/api/v1/media/folders`, { credentials: "same-origin" });
            const data = await response.json();
            if (response.ok && Array.isArray(data)) {
                state.folders = data;
            }
        } catch (_) {
            // noop
        } finally {
            renderFolderOptions();
        }
    }

    function renderMediaCard(item) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "mlm-card media-lib-item overflow-hidden rounded-md text-left transition";
        card.dataset.id = String(item.id);

        const previewUrl = item.preview_url || item.url || "";
        const fullUrl = item.url || previewUrl;
        const imageAlt = item.alt_text || item.title || item.filename || "image";
        const preview = String(item.file_type || "").startsWith("image")
            ? `<img data-src="${escapeHtml(previewUrl)}" data-full-src="${escapeHtml(fullUrl)}" alt="${escapeHtml(imageAlt)}" class="mlm-placeholder h-28 w-full object-cover" loading="lazy" decoding="async" fetchpriority="low" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==">`
            : `<div class="mlm-placeholder flex h-28 w-full items-center justify-center text-xs">非图片文件</div>`;
        card.innerHTML = `
            ${preview}
            <div class="p-2">
                <div class="mlm-card-title truncate text-xs font-medium">${escapeHtml(item.title || item.filename)}</div>
                <div class="mlm-muted truncate text-xs">${escapeHtml(item.filename)}</div>
            </div>
        `;

        const img = card.querySelector("img[data-src]");
        if (img) {
            img.addEventListener("error", () => {
                const fullSrc = img.dataset.fullSrc || "";
                if (!fullSrc) return;
                if (img.dataset.fallbackApplied === "1") return;
                img.dataset.fallbackApplied = "1";
                img.src = fullSrc;
            });
            observeLazyImage(img);
        }
        return card;
    }

    function rafYield() {
        return new Promise((resolve) => {
            requestAnimationFrame(() => resolve());
        });
    }

    async function appendMediaCards(items) {
        const safeItems = Array.isArray(items) ? items : [];
        const renderedIds = new Set(
            Array.from(elements.grid.querySelectorAll(".media-lib-item")).map((card) => String(card.dataset.id || ""))
        );
        for (let start = 0; start < safeItems.length; start += RENDER_CHUNK_SIZE) {
            const chunk = safeItems.slice(start, start + RENDER_CHUNK_SIZE);
            const fragment = document.createDocumentFragment();
            chunk.forEach((item) => {
                const mediaId = String(item?.id ?? "");
                if (!mediaId || renderedIds.has(mediaId)) return;
                renderedIds.add(mediaId);
                state.itemIndex.set(mediaId, item);
                fragment.appendChild(renderMediaCard(item));
            });
            elements.grid.appendChild(fragment);
            if (start + RENDER_CHUNK_SIZE < safeItems.length) {
                await rafYield();
            }
        }
    }

    async function loadMediaItems(loadMore = false) {
        if (state.loading) return;
        state.loading = true;
        const originalLoadMoreText = elements.loadMoreBtn.textContent;

        if (!loadMore) {
            state.page = 1;
            clearSelection();
            state.itemIndex.clear();
            elements.grid.innerHTML = "";
            elements.loading.classList.remove("hidden");
            elements.grid.appendChild(elements.loading);
        } else {
            state.page += 1;
            elements.loadMoreBtn.disabled = true;
            elements.loadMoreBtn.classList.add("opacity-70", "cursor-not-allowed");
            elements.loadMoreBtn.textContent = "加载中...";
        }

        const search = encodeURIComponent(elements.searchInput.value || "");
        const folder = encodeURIComponent(elements.folderFilter ? (elements.folderFilter.value || "__all__") : "__all__");
        const url = `${adminPath}/api/v1/media?page=${state.page}&limit=${state.perPage}&search=${search}&folder=${folder}`;

        try {
            const response = await fetch(url, { credentials: "same-origin" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const items = await response.json();
            if (!loadMore) elements.grid.innerHTML = "";

            if (!items.length && !loadMore) {
                elements.grid.innerHTML = `<div class="mlm-muted col-span-full py-8 text-center text-sm">暂无媒体文件</div>`;
            } else {
                await appendMediaCards(items);
                if (loadMore) {
                    trimRenderedMediaItems();
                }
            }

            const totalHeader = Number(response.headers.get("X-Total-Count"));
            state.hasMore = Number.isFinite(totalHeader) && totalHeader > 0
                ? state.page * state.perPage < totalHeader
                : items.length === state.perPage;
            state.lastLoadedAt = Date.now();
            elements.loadMoreBtn.classList.toggle("hidden", !state.hasMore);
        } catch (error) {
            if (loadMore) {
                state.page = Math.max(1, state.page - 1);
                if (typeof window.adminNotify === "function") {
                    window.adminNotify(`加载更多失败：${error.message}`, "warning", { duration: 3200 });
                }
            } else {
                elements.grid.innerHTML = `<div class="mlm-error col-span-full py-8 text-center text-sm">加载失败：${escapeHtml(error.message)}</div>`;
            }
        } finally {
            state.loading = false;
            elements.loading.classList.add("hidden");
            elements.loadMoreBtn.disabled = false;
            elements.loadMoreBtn.classList.remove("opacity-70", "cursor-not-allowed");
            if (originalLoadMoreText) {
                elements.loadMoreBtn.textContent = originalLoadMoreText;
            }
        }
    }

    function maybeLoadMoreByScroll() {
        if (!elements.grid || !state.hasMore || state.loading) return;
        const remain = elements.grid.scrollHeight - elements.grid.scrollTop - elements.grid.clientHeight;
        if (remain <= SCROLL_LOAD_THRESHOLD_PX) {
            loadMediaItems(true);
        }
    }

    function scheduleLoadMoreByScroll() {
        if (state.scrollLoadScheduled) return;
        state.scrollLoadScheduled = true;
        requestAnimationFrame(() => {
            state.scrollLoadScheduled = false;
            maybeLoadMoreByScroll();
        });
    }

    function defaultSelectHandler(item) {
        const featureImageUrlInput = document.getElementById("feature-image-url-input");
        const featureImagePreview = document.getElementById("feature-image-preview");
        const featureImageRemoveButton = document.getElementById("remove-feature-image-button");
        if (!featureImageUrlInput || !featureImagePreview || !featureImageRemoveButton) return;

        featureImageUrlInput.value = item.url;
        featureImagePreview.innerHTML = `<img src="${escapeHtml(item.url)}" alt="${escapeHtml(item.alt_text || item.title || item.filename)}" class="max-w-full h-auto rounded-md">`;
        featureImagePreview.classList.remove("hidden");
        featureImageRemoveButton.classList.remove("hidden");
    }

    async function uploadFiles(fileList) {
        const files = Array.from(fileList || []);
        if (!files.length) return;

        elements.uploadedPreview.innerHTML = "";
        elements.uploadStatus.classList.remove("hidden");

        let successCount = 0;
        let dedupedCount = 0;
        const targetFolder = elements.uploadFolderSelect ? elements.uploadFolderSelect.value : "";
        for (const file of files) {
            elements.uploadStatus.textContent = `上传中：${file.name}`;

            const formData = new FormData();
            formData.append("file", file);
            formData.append("title", file.name);
            formData.append("target_folder", targetFolder);
            formData.append("deduplicate", "true");

            try {
                const response = await fetch(`${adminPath}/media/upload`, {
                    method: "POST",
                    headers: { "X-CSRF-Token": csrfToken },
                    body: formData,
                    credentials: "same-origin",
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || response.statusText);
                }
                successCount += 1;
                if (data && data.is_duplicate) {
                    dedupedCount += 1;
                }

                const preview = document.createElement("div");
                preview.className = "mlm-preview rounded-md";
                preview.innerHTML = `
                    <img src="${escapeHtml(data.url)}" alt="${escapeHtml(data.title || data.filename)}" class="h-20 w-full rounded-t-md object-cover">
                    <div class="mlm-card-title truncate p-1 text-xs">${escapeHtml(data.title || data.filename)}</div>
                `;
                elements.uploadedPreview.appendChild(preview);
            } catch (error) {
                const errorRow = document.createElement("div");
                errorRow.className = "mlm-error col-span-full rounded-md p-2 text-xs";
                errorRow.textContent = `${file.name} 上传失败：${error.message}`;
                elements.uploadedPreview.appendChild(errorRow);
            }
        }

        elements.uploadStatus.textContent = dedupedCount > 0
            ? `上传完成：成功 ${successCount} / ${files.length}，其中复用重复文件 ${dedupedCount}`
            : `上传完成：成功 ${successCount} / ${files.length}`;
        await loadFolders();
        await loadMediaItems(false);
        switchTab("library");
    }

    function prewarmLibraryData() {
        if (state.hasBootstrapped || state.loading) return;
        Promise.all([loadFolders(), loadMediaItems(false)])
            .then(() => {
                state.hasBootstrapped = true;
            })
            .catch(() => {
                // 预热失败不影响手动打开时再加载。
            });
    }

    async function open(options = {}) {
        state.onSelect = typeof options.onSelect === "function" ? options.onSelect : null;
        // 只有编辑器插入正文时才展示尺寸档位，选封面/头像等场景保持简洁
        if (elements.sizeOptions) {
            elements.sizeOptions.classList.toggle("hidden", !options.showSizeOptions);
            elements.sizeOptions.classList.toggle("flex", Boolean(options.showSizeOptions));
        }
        if (elements.sizeSelect) {
            elements.sizeSelect.value = "";
        }
        modal.classList.remove("hidden");
        switchTab("library");

        const now = Date.now();
        const isStale = !state.lastLoadedAt || now - state.lastLoadedAt > DATA_CACHE_TTL_MS;
        if (!state.hasBootstrapped) {
            await Promise.all([loadFolders(), loadMediaItems(false)]);
            state.hasBootstrapped = true;
            return;
        }
        if (isStale) {
            loadFolders();
        }
    }

    function close() {
        modal.classList.add("hidden");
        clearSelection();
        state.onSelect = null;
        elements.uploadStatus.classList.add("hidden");
        elements.uploadStatus.textContent = "";
        elements.uploadedPreview.innerHTML = "";
        if (state.imageObserver) {
            state.imageObserver.disconnect();
            state.imageObserver = null;
        }
    }

    function confirmSelect() {
        if (!state.selectedItem) return;
        const sizeClass = elements.sizeSelect ? elements.sizeSelect.value : "";
        const handler = state.onSelect || defaultSelectHandler;
        handler(state.selectedItem, { sizeClass });
        close();
    }

    elements.closeBtn.addEventListener("click", close);
    modal.addEventListener("click", (event) => {
        if (event.target === modal) close();
    });
    elements.tabLibrary.addEventListener("click", () => switchTab("library"));
    elements.tabUpload.addEventListener("click", () => switchTab("upload"));
    elements.searchBtn.addEventListener("click", () => loadMediaItems(false));
    elements.folderFilter?.addEventListener("change", () => loadMediaItems(false));
    elements.grid.addEventListener("click", (event) => {
        const card = event.target.closest(".media-lib-item");
        if (!card || !elements.grid.contains(card)) return;
        setSelectionByCard(card);
    });
    elements.searchInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            event.preventDefault();
            loadMediaItems(false);
        }
    });
    elements.loadMoreBtn.addEventListener("click", () => loadMediaItems(true));
    elements.selectBtn.addEventListener("click", confirmSelect);
    elements.grid.addEventListener("scroll", scheduleLoadMoreByScroll, { passive: true });

    elements.dropArea.addEventListener("click", () => elements.fileInput.click());
    elements.fileInput.addEventListener("change", (event) => uploadFiles(event.target.files));
    elements.dropArea.addEventListener("dragover", (event) => {
        event.preventDefault();
        elements.dropArea.classList.add("is-dragover");
    });
    elements.dropArea.addEventListener("dragleave", () => {
        elements.dropArea.classList.remove("is-dragover");
    });
    elements.dropArea.addEventListener("drop", (event) => {
        event.preventDefault();
        elements.dropArea.classList.remove("is-dragover");
        uploadFiles(event.dataTransfer.files);
    });

    window.RewrzMediaLibrary = { open, close, loadMediaItems };
    window.openMediaLibraryModal = () => open();
    window.closeMediaLibraryModal = () => close();
    window.selectMediaItem = () => confirmSelect();

    const shouldPrewarm = Boolean(document.getElementById("insert-media-button") || document.getElementById("feature-image-upload-button"));
    if (shouldPrewarm) {
        if (typeof window.requestIdleCallback === "function") {
            window.requestIdleCallback(() => prewarmLibraryData(), { timeout: 2200 });
        } else {
            setTimeout(() => prewarmLibraryData(), 1200);
        }
    }
})();
</script>
