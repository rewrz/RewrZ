<div id="media-library-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 hidden">
    <div class="relative top-20 mx-auto p-5 border w-11/12 md:w-3/4 lg:w-2/3 shadow-lg rounded-md bg-white">
        <div class="flex justify-between items-center pb-3 border-b">
            <h3 class="text-xl font-semibold text-gray-900">媒体库</h3>
            <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center" onclick="closeMediaLibraryModal()">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
            </button>
        </div>

        <div class="mt-4">
            <!-- Tabs for Upload and Library -->
            <div class="border-b border-gray-200">
                <ul class="flex flex-wrap -mb-px text-sm font-medium text-center" id="media-tabs" role="tablist">
                    <li class="mr-2" role="presentation">
                        <button class="inline-block p-4 border-b-2 rounded-t-lg active" id="library-tab" data-tabs-target="#media-library-content" type="button" role="tab" aria-controls="media-library-content" aria-selected="true">媒体库</button>
                    </li>
                    <li class="mr-2" role="presentation">
                        <button class="inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" id="upload-tab" data-tabs-target="#media-upload-content" type="button" role="tab" aria-controls="media-upload-content" aria-selected="false">上传文件</button>
                    </li>
                </ul>
            </div>

            <!-- Tab Content -->
            <div id="media-tabs-content" class="mt-4">
                <!-- Media Library Content -->
                <div class="p-4 rounded-lg bg-gray-50" id="media-library-content" role="tabpanel" aria-labelledby="library-tab">
                    <div class="mb-4 flex space-x-2">
                        <input type="text" id="media-search-input" placeholder="搜索媒体文件..." class="flex-grow px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                        <button type="button" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700" onclick="loadMediaItems()">搜索</button>
                    </div>
                    <div id="media-items-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 max-h-96 overflow-y-auto p-2 border rounded-md bg-white">
                        <!-- Media items will be loaded here -->
                        <div class="text-center text-gray-500 py-10" id="media-loading-indicator">加载中...</div>
                    </div>
                    <div class="flex justify-center mt-4">
                        <button type="button" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-md hover:bg-gray-400 hidden" id="load-more-media-button" onclick="loadMediaItems(true)">加载更多</button>
                    </div>
                    <div class="flex justify-end mt-4">
                        <button type="button" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700" id="select-media-button" disabled onclick="selectMediaItem()">选择</button>
                    </div>
                </div>

                <!-- Media Upload Content -->
                <div class="hidden p-4 rounded-lg bg-gray-50" id="media-upload-content" role="tabpanel" aria-labelledby="upload-tab">
                    <div class="border-dashed border-2 border-gray-300 rounded-md p-6 text-center cursor-pointer hover:bg-gray-100" id="drop-area">
                        <input type="file" id="media-upload-file-input" accept="image/*" multiple class="hidden">
                        <p class="text-gray-600">将文件拖放到此处，或 <span class="text-blue-600 font-semibold">点击上传</span></p>
                        <p class="text-xs text-gray-500 mt-1">支持图片、视频等文件类型</p>
                    </div>
                    <div id="upload-progress-container" class="mt-4 hidden">
                        <div class="w-full bg-gray-200 rounded-full h-2.5 mb-4">
                            <div class="bg-blue-600 h-2.5 rounded-full" style="width: 0%" id="upload-progress-bar"></div>
                        </div>
                        <p class="text-sm text-gray-600" id="upload-status-text">等待上传...</p>
                    </div>
                    <div id="uploaded-files-preview" class="mt-4 grid grid-cols-3 gap-4">
                        <!-- Uploaded file previews will be here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let selectedMediaItem = null;
    let currentPage = 1;
    const itemsPerPage = 12; // 每页显示的项目数量

    function openMediaLibraryModal() {
        document.getElementById('media-library-modal').classList.remove('hidden');
        loadMediaItems(); // 每次打开模态框时加载媒体文件
        // 激活媒体库tab
        document.getElementById('library-tab').click();
    }

    function closeMediaLibraryModal() {
        document.getElementById('media-library-modal').classList.add('hidden');
        selectedMediaItem = null;
        document.getElementById('select-media-button').disabled = true;
        document.querySelectorAll('.media-item-card').forEach(card => card.classList.remove('border-blue-500', 'border-2'));
    }

    async function loadMediaItems(loadMore = false) {
        const grid = document.getElementById('media-items-grid');
        const loadingIndicator = document.getElementById('media-loading-indicator');
        const loadMoreButton = document.getElementById('load-more-media-button');
        
        if (!loadMore) {
            grid.innerHTML = ''; // 清空现有内容
            currentPage = 1;
            loadingIndicator.classList.remove('hidden');
            loadMoreButton.classList.add('hidden');
        } else {
            currentPage++;
        }

        try {
            const search = document.getElementById('media-search-input').value;
            const response = await fetch(`{{ request.state.admin_path }}/api/media?page=${currentPage}&limit=${itemsPerPage}&search=${search}`);
            if (!response.ok) {
                throw new Error('无法加载媒体文件');
            }
            const mediaItems = await response.json();

            loadingIndicator.classList.add('hidden');

            if (mediaItems.length === 0 && !loadMore) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-10">没有找到媒体文件。</p>';
            } else {
                mediaItems.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'media-item-card relative group cursor-pointer border border-gray-200 rounded-lg overflow-hidden shadow-sm hover:shadow-md transition-shadow';
                    card.dataset.filepath = item.filepath;
                    card.dataset.url = item.filepath.replace('{{ media_upload_dir_name }}', '/media'); // 动态路径
                    card.dataset.id = item.id;
                    card.dataset.title = item.title;

                    card.innerHTML = `
                        <img src="${item.filepath.replace('{{ media_upload_dir_name }}', '/media')}" alt="${item.title}" class="w-full h-32 object-cover">
                        <div class="p-2 text-sm truncate">${item.title}</div>
                        <div class="absolute inset-0 bg-blue-500 bg-opacity-0 group-hover:bg-opacity-20 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fas fa-check-circle text-white text-3xl hidden selected-icon"></i>
                        </div>
                    `;
                    card.addEventListener('click', () => {
                        document.querySelectorAll('.media-item-card').forEach(c => {
                            c.classList.remove('border-blue-500', 'border-2');
                            c.querySelector('.selected-icon').classList.add('hidden');
                        });
                        card.classList.add('border-blue-500', 'border-2');
                        card.querySelector('.selected-icon').classList.remove('hidden');
                        selectedMediaItem = {
                            id: item.id,
                            filepath: item.filepath,
                            url: item.filepath.replace('{{ media_upload_dir_name }}', '/media'),
                            title: item.title
                        };
                        document.getElementById('select-media-button').disabled = false;
                    });
                    grid.appendChild(card);
                });

                if (mediaItems.length === itemsPerPage) {
                    loadMoreButton.classList.remove('hidden');
                } else {
                    loadMoreButton.classList.add('hidden');
                }
            }
        } catch (error) {
            console.error('加载媒体文件失败:', error);
            loadingIndicator.classList.add('hidden');
            grid.innerHTML = '<p class="col-span-full text-center text-red-500 py-10">加载媒体文件时发生错误。</p>';
        }
    }

    function selectMediaItem() {
        if (selectedMediaItem) {
            featureImageUrlInput.value = selectedMediaItem.url;
            featureImagePreview.innerHTML = `<img src="${selectedMediaItem.url}" alt="${selectedMediaItem.title}" class="max-w-full h-auto rounded-md">`;
            featureImagePreview.classList.remove('hidden');
            featureImageRemoveButton.classList.remove('hidden');
            closeMediaLibraryModal();
        }
    }

    // Tab switching logic
    document.querySelectorAll('#media-tabs button').forEach(button => {
        button.addEventListener('click', () => {
            document.querySelectorAll('#media-tabs button').forEach(btn => {
                btn.classList.remove('active', 'border-b-2', 'border-blue-600');
                btn.classList.add('border-transparent', 'hover:text-gray-600', 'hover:border-gray-300');
                btn.setAttribute('aria-selected', 'false');
            });
            document.querySelectorAll('#media-tabs-content > div').forEach(content => {
                content.classList.add('hidden');
            });

            button.classList.add('active', 'border-b-2', 'border-blue-600');
            button.classList.remove('border-transparent', 'hover:text-gray-600', 'hover:border-gray-300');
            button.setAttribute('aria-selected', 'true');
            
            const targetId = button.dataset.tabsTarget;
            document.querySelector(targetId).classList.remove('hidden');

            if (targetId === '#media-library-content') {
                loadMediaItems(); // 切换到媒体库时重新加载
            }
        });
    });

    // Upload tab logic
    const dropArea = document.getElementById('drop-area');
    const mediaUploadFileInput = document.getElementById('media-upload-file-input');
    const uploadProgressBar = document.getElementById('upload-progress-bar');
    const uploadProgressContainer = document.getElementById('upload-progress-container');
    const uploadStatusText = document.getElementById('upload-status-text');
    const uploadedFilesPreview = document.getElementById('uploaded-files-preview');

    dropArea.addEventListener('click', () => mediaUploadFileInput.click());

    dropArea.addEventListener('dragover', (event) => {
        event.preventDefault();
        dropArea.classList.add('border-blue-500', 'bg-blue-50');
    });

    dropArea.addEventListener('dragleave', () => {
        dropArea.classList.remove('border-blue-500', 'bg-blue-50');
    });

    dropArea.addEventListener('drop', (event) => {
        event.preventDefault();
        dropArea.classList.remove('border-blue-500', 'bg-blue-50');
        const files = event.dataTransfer.files;
        handleFiles(files);
    });

    mediaUploadFileInput.addEventListener('change', (event) => {
        const files = event.target.files;
        handleFiles(files);
    });

    async function handleFiles(files) {
        uploadedFilesPreview.innerHTML = ''; // Clear previous previews
        uploadProgressContainer.classList.remove('hidden');
        uploadProgressBar.style.width = '0%';
        uploadStatusText.textContent = '开始上传...';

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('title', file.name); // Use filename as default title

            try {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '{{ request.state.admin_path }}/media/upload', true);
                xhr.setRequestHeader('X-CSRF-Token', document.querySelector('input[name="csrf_token"]').value);

                xhr.upload.addEventListener('progress', (event) => {
                    if (event.lengthComputable) {
                        const percent = (event.loaded / event.total) * 100;
                        uploadProgressBar.style.width = `${percent}%`;
                        uploadStatusText.textContent = `上传中: ${file.name} (${percent.toFixed(0)}%)`;
                    }
                });

                xhr.onload = () => {
                    if (xhr.status === 200) {
                        const media = JSON.parse(xhr.responseText);
                        const imageUrl = media.filepath.replace('{{ media_upload_dir_name }}', '/media');
                        displayUploadedFile(imageUrl, media.title);
                        uploadStatusText.textContent = `上传成功: ${file.name}`;
                    } else {
                        const errorData = JSON.parse(xhr.responseText);
                        uploadStatusText.textContent = `上传失败: ${file.name} - ${errorData.detail || '未知错误'}`;
                        console.error('上传文件时发生错误:', errorData);
                    }
                };

                xhr.onerror = () => {
                    uploadStatusText.textContent = `上传失败: ${file.name} - 网络错误`;
                    console.error('网络错误');
                };

                xhr.send(formData);

            } catch (error) {
                console.error('上传文件时发生错误:', error);
                uploadStatusText.textContent = `上传失败: ${file.name} - ${error.message}`;
            }
        }
    }

    function displayUploadedFile(url, title) {
        const previewCard = document.createElement('div');
        previewCard.className = 'relative group cursor-pointer border border-gray-200 rounded-lg overflow-hidden shadow-sm';
        previewCard.innerHTML = `
            <img src="${url}" alt="${title}" class="w-full h-24 object-cover">
            <div class="p-1 text-xs truncate">${title}</div>
        `;
        uploadedFilesPreview.appendChild(previewCard);
    }

    // Initial load for media library tab
    document.addEventListener('DOMContentLoaded', () => {
        // Simulate click on the default active tab
        document.getElementById('library-tab').click();
    });
</script>
