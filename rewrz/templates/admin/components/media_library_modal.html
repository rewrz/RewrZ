<div id="media-library-modal" class="fixed inset-0 z-50 hidden bg-gray-900/50 p-4">
    <div class="mx-auto mt-8 w-full max-w-5xl rounded-lg bg-white shadow-xl">
        <div class="flex items-center justify-between border-b px-5 py-4">
            <h3 class="text-lg font-semibold text-gray-900">媒体库</h3>
            <button type="button" id="media-lib-close-btn" class="rounded p-2 text-gray-500 hover:bg-gray-100 hover:text-gray-700">
                <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                </svg>
            </button>
        </div>

        <div class="px-5 pb-5 pt-4">
            <div class="mb-4 border-b border-gray-200">
                <nav class="-mb-px flex gap-4">
                    <button type="button" id="media-lib-tab-library" class="border-b-2 border-blue-600 px-1 py-2 text-sm font-medium text-blue-600">媒体库</button>
                    <button type="button" id="media-lib-tab-upload" class="border-b-2 border-transparent px-1 py-2 text-sm font-medium text-gray-500 hover:text-gray-700">上传文件</button>
                </nav>
            </div>

            <section id="media-lib-panel-library" class="space-y-4">
                <div class="flex gap-2">
                    <input type="text" id="media-lib-search-input" placeholder="按标题或文件名搜索..." class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
                    <select id="media-lib-folder-filter" class="w-44 rounded-md border border-gray-300 px-2 py-2 text-sm"></select>
                    <button type="button" id="media-lib-search-btn" class="rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">搜索</button>
                </div>

                <div id="media-lib-grid" class="grid max-h-96 grid-cols-2 gap-3 overflow-y-auto rounded-md border border-gray-200 p-3 md:grid-cols-4">
                    <div id="media-lib-loading" class="col-span-full py-8 text-center text-sm text-gray-500">加载中...</div>
                </div>

                <div class="flex items-center justify-between">
                    <button type="button" id="media-lib-load-more-btn" class="hidden rounded-md bg-gray-100 px-3 py-2 text-sm text-gray-700 hover:bg-gray-200">加载更多</button>
                    <button type="button" id="media-lib-select-btn" class="ml-auto rounded-md bg-green-600 px-4 py-2 text-sm font-medium text-white hover:bg-green-700 disabled:cursor-not-allowed disabled:opacity-50" disabled>插入选中项</button>
                </div>
            </section>

            <section id="media-lib-panel-upload" class="hidden space-y-4">
                <div>
                    <label for="media-lib-upload-folder-select" class="mb-1 block text-xs text-gray-600">上传到文件夹</label>
                    <select id="media-lib-upload-folder-select" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm"></select>
                </div>
                <div id="media-lib-drop-area" class="cursor-pointer rounded-md border-2 border-dashed border-gray-300 p-8 text-center hover:bg-gray-50">
                    <input type="file" id="media-lib-file-input" multiple class="hidden">
                    <p class="text-sm text-gray-700">拖拽文件到此处，或点击选择</p>
                    <p class="mt-1 text-xs text-gray-500">支持图片、视频、音频和常见文档</p>
                </div>

                <div id="media-lib-upload-status" class="hidden rounded-md bg-gray-50 p-3 text-sm text-gray-600"></div>
                <div id="media-lib-uploaded-preview" class="grid grid-cols-3 gap-3"></div>
            </section>
        </div>
    </div>
</div>

<script>
(() => {
    const adminPath = "{{ request.state.admin_path }}";
    const csrfToken = "{{ request.state.csrf_token }}";

    const modal = document.getElementById("media-library-modal");
    if (!modal) return;

    const elements = {
        closeBtn: document.getElementById("media-lib-close-btn"),
        tabLibrary: document.getElementById("media-lib-tab-library"),
        tabUpload: document.getElementById("media-lib-tab-upload"),
        panelLibrary: document.getElementById("media-lib-panel-library"),
        panelUpload: document.getElementById("media-lib-panel-upload"),
        searchInput: document.getElementById("media-lib-search-input"),
        folderFilter: document.getElementById("media-lib-folder-filter"),
        uploadFolderSelect: document.getElementById("media-lib-upload-folder-select"),
        searchBtn: document.getElementById("media-lib-search-btn"),
        grid: document.getElementById("media-lib-grid"),
        loading: document.getElementById("media-lib-loading"),
        loadMoreBtn: document.getElementById("media-lib-load-more-btn"),
        selectBtn: document.getElementById("media-lib-select-btn"),
        dropArea: document.getElementById("media-lib-drop-area"),
        fileInput: document.getElementById("media-lib-file-input"),
        uploadStatus: document.getElementById("media-lib-upload-status"),
        uploadedPreview: document.getElementById("media-lib-uploaded-preview"),
    };

    const state = {
        selectedItem: null,
        selectedItemId: null,
        selectedCardEl: null,
        page: 1,
        perPage: 12,
        hasMore: false,
        loading: false,
        onSelect: null,
        folders: [],
        itemIndex: new Map(),
    };
    const MAX_RENDERED_MEDIA_ITEMS = 240;
    const TRIMMED_MEDIA_ITEMS = 180;

    function switchTab(tabName) {
        const isLibrary = tabName === "library";
        elements.panelLibrary.classList.toggle("hidden", !isLibrary);
        elements.panelUpload.classList.toggle("hidden", isLibrary);
        elements.tabLibrary.className = isLibrary
            ? "border-b-2 border-blue-600 px-1 py-2 text-sm font-medium text-blue-600"
            : "border-b-2 border-transparent px-1 py-2 text-sm font-medium text-gray-500 hover:text-gray-700";
        elements.tabUpload.className = isLibrary
            ? "border-b-2 border-transparent px-1 py-2 text-sm font-medium text-gray-500 hover:text-gray-700"
            : "border-b-2 border-blue-600 px-1 py-2 text-sm font-medium text-blue-600";
    }

    function clearSelection() {
        state.selectedItem = null;
        state.selectedItemId = null;
        if (state.selectedCardEl && state.selectedCardEl.isConnected) {
            state.selectedCardEl.classList.remove("ring-2", "ring-blue-500");
        }
        state.selectedCardEl = null;
        elements.selectBtn.disabled = true;
    }

    function setSelectionByCard(card) {
        const itemId = String(card?.dataset?.id || "");
        if (!itemId) return;
        const item = state.itemIndex.get(itemId);
        if (!item) return;

        if (state.selectedCardEl && state.selectedCardEl !== card && state.selectedCardEl.isConnected) {
            state.selectedCardEl.classList.remove("ring-2", "ring-blue-500");
        }
        state.selectedItem = item;
        state.selectedItemId = itemId;
        state.selectedCardEl = card;
        card.classList.add("ring-2", "ring-blue-500");
        elements.selectBtn.disabled = false;
    }

    function trimRenderedMediaItems() {
        const cards = elements.grid.querySelectorAll(".media-lib-item");
        if (cards.length <= MAX_RENDERED_MEDIA_ITEMS) return;
        let removeCount = cards.length - TRIMMED_MEDIA_ITEMS;
        cards.forEach((card) => {
            if (removeCount <= 0) return;
            if (state.selectedCardEl === card) return;
            const mediaId = String(card.dataset.id || "");
            if (mediaId) {
                state.itemIndex.delete(mediaId);
            }
            card.remove();
            removeCount -= 1;
        });
    }

    function renderFolderOptions() {
        const folderOptions = Array.isArray(state.folders) ? state.folders : [];
        const libraryOptions = [{ path: "__all__", name: "全部文件夹", count: null }].concat(
            folderOptions.filter((item) => item.path !== "__all__")
        );
        const uploadOptions = [{ path: "", name: "根目录", count: null }].concat(
            folderOptions.filter((item) => item.path !== "__all__" && item.path !== "")
        );

        const fillSelect = (el, options) => {
            if (!el) return;
            const oldValue = el.value;
            el.innerHTML = "";
            options.forEach((item) => {
                const option = document.createElement("option");
                option.value = item.path;
                option.textContent = `${item.name}${typeof item.count === "number" ? ` (${item.count})` : ""}`;
                el.appendChild(option);
            });
            if (Array.from(el.options).some((opt) => opt.value === oldValue)) {
                el.value = oldValue;
            }
        };

        fillSelect(elements.folderFilter, libraryOptions);
        fillSelect(elements.uploadFolderSelect, uploadOptions);

        if (elements.folderFilter && !elements.folderFilter.value) {
            elements.folderFilter.value = "__all__";
        }
    }

    async function loadFolders() {
        try {
            const response = await fetch(`${adminPath}/api/v1/media/folders`, { credentials: "same-origin" });
            const data = await response.json();
            if (response.ok && Array.isArray(data)) {
                state.folders = data;
            }
        } catch (_) {
            // noop
        } finally {
            renderFolderOptions();
        }
    }

    function renderMediaCard(item) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "media-lib-item overflow-hidden rounded-md border border-gray-200 text-left transition hover:shadow";
        card.dataset.id = String(item.id);

        const preview = String(item.file_type || "").startsWith("image")
            ? `<img src="${item.url}" alt="${item.alt_text || item.title || item.filename}" class="h-28 w-full object-cover" loading="lazy" decoding="async">`
            : `<div class="flex h-28 w-full items-center justify-center bg-gray-100 text-xs text-gray-500">非图片文件</div>`;
        card.innerHTML = `
            ${preview}
            <div class="p-2">
                <div class="truncate text-xs font-medium text-gray-800">${item.title || item.filename}</div>
                <div class="truncate text-xs text-gray-500">${item.filename}</div>
            </div>
        `;
        return card;
    }

    async function loadMediaItems(loadMore = false) {
        if (state.loading) return;
        state.loading = true;

        if (!loadMore) {
            state.page = 1;
            clearSelection();
            state.itemIndex.clear();
            elements.grid.innerHTML = "";
            elements.loading.classList.remove("hidden");
            elements.grid.appendChild(elements.loading);
        } else {
            state.page += 1;
        }

        const search = encodeURIComponent(elements.searchInput.value || "");
        const folder = encodeURIComponent(elements.folderFilter ? (elements.folderFilter.value || "__all__") : "__all__");
        const url = `${adminPath}/api/v1/media?page=${state.page}&limit=${state.perPage}&search=${search}&folder=${folder}`;

        try {
            const response = await fetch(url, { credentials: "same-origin" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const items = await response.json();
            if (!loadMore) elements.grid.innerHTML = "";

            if (!items.length && !loadMore) {
                elements.grid.innerHTML = `<div class="col-span-full py-8 text-center text-sm text-gray-500">暂无媒体文件</div>`;
            } else {
                const fragment = document.createDocumentFragment();
                items.forEach((item) => {
                    const mediaId = String(item.id);
                    state.itemIndex.set(mediaId, item);
                    fragment.appendChild(renderMediaCard(item));
                });
                elements.grid.appendChild(fragment);
                if (loadMore) {
                    trimRenderedMediaItems();
                }
            }

            state.hasMore = items.length === state.perPage;
            elements.loadMoreBtn.classList.toggle("hidden", !state.hasMore);
        } catch (error) {
            elements.grid.innerHTML = `<div class="col-span-full py-8 text-center text-sm text-red-600">加载失败：${error.message}</div>`;
        } finally {
            state.loading = false;
            elements.loading.classList.add("hidden");
        }
    }

    function defaultSelectHandler(item) {
        const featureImageUrlInput = document.getElementById("feature-image-url-input");
        const featureImagePreview = document.getElementById("feature-image-preview");
        const featureImageRemoveButton = document.getElementById("remove-feature-image-button");
        if (!featureImageUrlInput || !featureImagePreview || !featureImageRemoveButton) return;

        featureImageUrlInput.value = item.url;
        featureImagePreview.innerHTML = `<img src="${item.url}" alt="${item.alt_text || item.title || item.filename}" class="max-w-full h-auto rounded-md">`;
        featureImagePreview.classList.remove("hidden");
        featureImageRemoveButton.classList.remove("hidden");
    }

    async function uploadFiles(fileList) {
        const files = Array.from(fileList || []);
        if (!files.length) return;

        elements.uploadedPreview.innerHTML = "";
        elements.uploadStatus.classList.remove("hidden");

        let successCount = 0;
        let dedupedCount = 0;
        const targetFolder = elements.uploadFolderSelect ? elements.uploadFolderSelect.value : "";
        for (const file of files) {
            elements.uploadStatus.textContent = `上传中：${file.name}`;

            const formData = new FormData();
            formData.append("file", file);
            formData.append("title", file.name);
            formData.append("target_folder", targetFolder);
            formData.append("deduplicate", "true");

            try {
                const response = await fetch(`${adminPath}/media/upload`, {
                    method: "POST",
                    headers: { "X-CSRF-Token": csrfToken },
                    body: formData,
                    credentials: "same-origin",
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || response.statusText);
                }
                successCount += 1;
                if (data && data.is_duplicate) {
                    dedupedCount += 1;
                }

                const preview = document.createElement("div");
                preview.className = "rounded-md border border-gray-200";
                preview.innerHTML = `
                    <img src="${data.url}" alt="${data.title || data.filename}" class="h-20 w-full rounded-t-md object-cover">
                    <div class="truncate p-1 text-xs text-gray-700">${data.title || data.filename}</div>
                `;
                elements.uploadedPreview.appendChild(preview);
            } catch (error) {
                const errorRow = document.createElement("div");
                errorRow.className = "col-span-full rounded-md bg-red-50 p-2 text-xs text-red-600";
                errorRow.textContent = `${file.name} 上传失败：${error.message}`;
                elements.uploadedPreview.appendChild(errorRow);
            }
        }

        elements.uploadStatus.textContent = dedupedCount > 0
            ? `上传完成：成功 ${successCount} / ${files.length}，其中复用重复文件 ${dedupedCount}`
            : `上传完成：成功 ${successCount} / ${files.length}`;
        await loadFolders();
        await loadMediaItems(false);
        switchTab("library");
    }

    async function open(options = {}) {
        state.onSelect = typeof options.onSelect === "function" ? options.onSelect : null;
        modal.classList.remove("hidden");
        switchTab("library");
        await loadFolders();
        await loadMediaItems(false);
    }

    function close() {
        modal.classList.add("hidden");
        clearSelection();
        state.onSelect = null;
        elements.uploadStatus.classList.add("hidden");
        elements.uploadStatus.textContent = "";
        elements.uploadedPreview.innerHTML = "";
    }

    function confirmSelect() {
        if (!state.selectedItem) return;
        const handler = state.onSelect || defaultSelectHandler;
        handler(state.selectedItem);
        close();
    }

    elements.closeBtn.addEventListener("click", close);
    modal.addEventListener("click", (event) => {
        if (event.target === modal) close();
    });
    elements.tabLibrary.addEventListener("click", () => switchTab("library"));
    elements.tabUpload.addEventListener("click", () => switchTab("upload"));
    elements.searchBtn.addEventListener("click", () => loadMediaItems(false));
    elements.folderFilter?.addEventListener("change", () => loadMediaItems(false));
    elements.grid.addEventListener("click", (event) => {
        const card = event.target.closest(".media-lib-item");
        if (!card || !elements.grid.contains(card)) return;
        setSelectionByCard(card);
    });
    elements.searchInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            event.preventDefault();
            loadMediaItems(false);
        }
    });
    elements.loadMoreBtn.addEventListener("click", () => loadMediaItems(true));
    elements.selectBtn.addEventListener("click", confirmSelect);

    elements.dropArea.addEventListener("click", () => elements.fileInput.click());
    elements.fileInput.addEventListener("change", (event) => uploadFiles(event.target.files));
    elements.dropArea.addEventListener("dragover", (event) => {
        event.preventDefault();
        elements.dropArea.classList.add("border-blue-500", "bg-blue-50");
    });
    elements.dropArea.addEventListener("dragleave", () => {
        elements.dropArea.classList.remove("border-blue-500", "bg-blue-50");
    });
    elements.dropArea.addEventListener("drop", (event) => {
        event.preventDefault();
        elements.dropArea.classList.remove("border-blue-500", "bg-blue-50");
        uploadFiles(event.dataTransfer.files);
    });

    window.RewrzMediaLibrary = { open, close, loadMediaItems };
    window.openMediaLibraryModal = () => open();
    window.closeMediaLibraryModal = () => close();
    window.selectMediaItem = () => confirmSelect();
})();
</script>
