{% extends "base.html" %}

{% block title %}搜索结果 - {{ site_title }}{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    {% set search_use_htmx = list_navigation_mode == 'infinite_scroll' %}
    <!-- 搜索表单 -->
    <div class="bg-white p-6 rounded-lg shadow-md mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">全站搜索</h1>
        
        <form
            id="search-form"
            method="GET"
            action="/search"
            class="space-y-4"
            {% if search_use_htmx %}
            hx-get="/search"
            hx-target="#search-panel"
            hx-push-url="true"
            {% endif %}
        >
            <div class="flex space-x-4">
                <div class="flex-1 relative">
                    <input type="text" 
                           name="q" 
                           value="{{ search_info.query }}" 
                           placeholder="请输入搜索关键词..." 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                           autocomplete="off"
                           id="search-input">
                    <div id="search-suggestions" class="absolute z-10 w-full bg-white border border-gray-300 rounded-lg shadow-lg hidden"></div>
                    <!-- 建议接口兜底提示 -->
                    <div id="suggestion-error" class="absolute left-0 right-0 mt-2 text-sm text-red-600 hidden">
                        无法获取搜索建议，请稍后重试。
                    </div>
                </div>
                <button type="submit" id="search-submit-btn"
                        class="relative z-20 px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 focus:ring-2 focus:ring-indigo-500">
                    <i class="fas fa-search mr-2"></i>搜索
                </button>
            </div>
            
            <!-- 高级筛选 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">分类筛选</label>
                    <select name="category" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">所有分类</option>
                        {% for category in categories %}
                        <option value="{{ category.slug }}" {{ 'selected' if category.slug == search_info.category else '' }}>
                            {{ category.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">标签筛选</label>
                    <select name="tag" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">所有标签</option>
                        {% for tag in tags %}
                        <option value="{{ tag.slug }}" {{ 'selected' if tag.slug == search_info.tag else '' }}>
                            {{ tag.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">格式筛选</label>
                    <select name="format" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="">所有格式</option>
                        {% for format in formats %}
                        <option value="{{ format.slug }}" {{ 'selected' if format.slug == search_info.format else '' }}>
                            {{ format.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <!-- 排序选项 -->
            <div class="flex items-center space-x-4">
                <label class="text-sm font-medium text-gray-700">排序方式：</label>
                <div class="flex space-x-4">
                    <label class="inline-flex items-center">
                        <input type="radio" name="sort" value="relevance" {{ 'checked' if search_info.sort == 'relevance' else '' }} class="form-radio">
                        <span class="ml-2 text-sm text-gray-700">相关性</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="sort" value="date" {{ 'checked' if search_info.sort == 'date' else '' }} class="form-radio">
                        <span class="ml-2 text-sm text-gray-700">发布时间</span>
                    </label>
                    <label class="inline-flex items-center">
                        <input type="radio" name="sort" value="title" {{ 'checked' if search_info.sort == 'title' else '' }} class="form-radio">
                        <span class="ml-2 text-sm text-gray-700">标题</span>
                    </label>
                </div>
            </div>
        </form>
    </div>
    
    <div id="search-panel">
        {% include "components/search_results_panel.html" %}
    </div>
</div>

<script>
// 搜索建议功能
const searchInput = document.getElementById('search-input');
const suggestionsContainer = document.getElementById('search-suggestions');
const suggestionError = document.getElementById('suggestion-error');
const searchForm = document.getElementById('search-form');
const searchSubmitBtn = document.getElementById('search-submit-btn');
let suggestionsTimeout;

searchInput.addEventListener('input', function() {
    const query = this.value.trim();
    
    if (suggestionsTimeout) {
        clearTimeout(suggestionsTimeout);
    }
    
    if (query.length < 2) {
        hideSuggestions();
        hideSuggestionError();
        return;
    }
    
    suggestionsTimeout = setTimeout(() => {
        fetchSuggestions(query);
    }, 300);
});

searchInput.addEventListener('blur', function() {
    // 延迟隐藏，允许点击建议项
    setTimeout(hideSuggestions, 200);
});

// 筛选/排序切换后自动触发无刷新搜索
if (searchForm) {
    searchForm.querySelectorAll('select, input[type="radio"]').forEach((control) => {
        control.addEventListener('change', () => {
            searchForm.requestSubmit();
        });
    });
}

if (searchSubmitBtn && searchForm) {
    searchSubmitBtn.addEventListener('click', function (event) {
        event.preventDefault();
        hideSuggestions();
        hideSuggestionError();
        searchForm.requestSubmit();
    });
}

async function fetchSuggestions(query) {
    try {
        const response = await fetch(`/api/v1/search/suggestions?q=${encodeURIComponent(query)}`);
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        const data = await response.json();
        showSuggestions(data.suggestions || []);
        hideSuggestionError();
    } catch (error) {
        console.error('获取搜索建议失败:', error);
        showSuggestionError('无法获取搜索建议，请稍后重试。');
        hideSuggestions();
    }
}

function showSuggestions(suggestions) {
    if (suggestions.length === 0) {
        hideSuggestions();
        return;
    }
    
    const html = suggestions.map(suggestion => `
        <div class="p-3 hover:bg-gray-50 cursor-pointer suggestion-item" data-url="${suggestion.url}">
            <div class="flex items-center">
                <i class="fas fa-${getIcon(suggestion.type)} text-gray-400 mr-2"></i>
                <span>${escapeHtml(suggestion.title)}</span>
            </div>
        </div>
    `).join('');
    
    suggestionsContainer.innerHTML = html;
    suggestionsContainer.classList.remove('hidden');
    
    // 添加点击事件
    suggestionsContainer.querySelectorAll('.suggestion-item').forEach(item => {
        item.addEventListener('click', function() {
            window.location.href = this.dataset.url;
        });
    });
}

function hideSuggestions() {
    suggestionsContainer.classList.add('hidden');
}

function getIcon(type) {
    switch (type) {
        case 'post': return 'file-alt';
        case 'category': return 'folder';
        case 'tag': return 'tag';
        default: return 'search';
    }
}

function showSuggestionError(message) {
    suggestionError.textContent = message || '无法获取搜索建议，请稍后重试。';
    suggestionError.classList.remove('hidden');
}

function hideSuggestionError() {
    suggestionError.classList.add('hidden');
}

// 关键词高亮：支持空格/中文分词（与后端一致的简单规则）
function highlightResults() {
    const queryTextEl = document.getElementById('query-text');
    if (!queryTextEl) return;
    const q = (queryTextEl.textContent || '').trim();
    if (!q) return;
    const tokens = q.match(/[\u4e00-\u9fff]+|[A-Za-z0-9]+/g) || [q];
    const unique = [];
    tokens.forEach(t => { if (!unique.includes(t)) unique.push(t); });
    if (unique.length === 0) unique.push(q);

    const buildHighlightedHtml = (rawText) => {
        let html = escapeHtml(rawText);
        unique.forEach(tok => {
            const esc = tok.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const re = new RegExp(`(${esc})`, 'gi');
            html = html.replace(re, '<mark class="bg-yellow-200 px-1 rounded">$1</mark>');
        });
        return html;
    };

    const wrapHighlight = (el) => {
        if (!el.dataset.rawText) {
            el.dataset.rawText = el.textContent || '';
        }
        el.innerHTML = buildHighlightedHtml(el.dataset.rawText);
    };

    document.querySelectorAll('.result-title').forEach(wrapHighlight);
    document.querySelectorAll('.result-excerpt').forEach(wrapHighlight);
}

// 分页URL可读性优化：使用 URLSearchParams 维护参数
function enhancePagination() {
    const container = document.getElementById('pagination');
    if (!container) return;
    const currentParams = new URLSearchParams(window.location.search);
    container.querySelectorAll('a[href*="page="]').forEach(a => {
        const url = new URL(a.href, window.location.origin);
        const targetPage = url.searchParams.get('page');
        const newParams = new URLSearchParams(currentParams);
        newParams.set('page', targetPage || '1');
        // 规范化：移除空参数
        ['category','tag','format'].forEach(k => { if (!newParams.get(k)) newParams.delete(k); });
        // 标准化排序值
        if (!newParams.get('sort')) newParams.set('sort', 'relevance');
        // 使用直观的顺序构建查询串
        const ordered = new URLSearchParams();
        ['q','category','tag','format','sort','page'].forEach(k => { if (newParams.has(k)) ordered.set(k, newParams.get(k)); });
        a.href = `/search?${ordered.toString()}`;
    });
}

// 简单的HTML转义，避免建议标题插入风险
function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
}

// 初始化与 HTMX 局部刷新后重绑定
function initSearchEnhancements() {
    highlightResults();
    enhancePagination();
}

document.addEventListener('DOMContentLoaded', initSearchEnhancements);
document.body.addEventListener('htmx:afterSwap', function(event) {
    const target = event.detail && event.detail.target ? event.detail.target : event.target;
    if (!target) return;
    if (target.id === 'search-panel' || (target.closest && target.closest('#search-panel'))) {
        initSearchEnhancements();
    }
});
</script>

{% endblock %}
