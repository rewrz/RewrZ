<div class="reply-form" data-reply-form>
    <div class="reply-form__head">
        <span class="reply-form__title"><i class="fas fa-reply" aria-hidden="true"></i> 回复 @{{ parent_author_name }}</span>
        <button
            type="button"
            class="reply-form__close"
            aria-label="收起回复框"
            onclick="document.getElementById('comment-form-{{ parent_id }}').innerHTML = ''"
        ><i class="fas fa-xmark" aria-hidden="true"></i></button>
    </div>

    <form
        class="rewrz-comment-form comment-composer comment-composer--compact"
        data-form-kind="reply"
        hx-post="/api/v1/comments/{{ post_id }}"
        hx-target="#comment-{{ parent_id }}-children"
        hx-swap="beforeend"
        hx-on::before-request="window.rewrzCommentUI && window.rewrzCommentUI.beforeRequest(this)"
        hx-on::after-request="window.rewrzCommentUI && window.rewrzCommentUI.afterRequest(event, this); if (event.detail.successful) { if (window.multiFormatInteractions && typeof window.multiFormatInteractions.updateInlineCommentCount === 'function') { window.multiFormatInteractions.updateInlineCommentCount('{{ post_id }}', 1); } const childBox = document.getElementById('comment-{{ parent_id }}-children'); if (childBox) childBox.classList.remove('hidden'); const wrap = document.getElementById('comment-form-{{ parent_id }}'); if (wrap) wrap.innerHTML = ''; }"
        hx-on::response-error="window.rewrzCommentUI && window.rewrzCommentUI.onError(event, this)"
    >
        <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
        <input type="hidden" name="parent_id" value="{{ parent_id }}">
        <input type="hidden" name="ft" value="{{ form_timestamp_token }}">

        <div class="absolute -left-[9999px] top-auto h-px w-px overflow-hidden" aria-hidden="true">
            <label for="reply-hp-field-{{ parent_id }}">请勿填写</label>
            <input type="text" id="reply-hp-field-{{ parent_id }}" name="hp_field" tabindex="-1" autocomplete="off" value="">
        </div>

        {% if logged_in_user %}
        {% set logged_name = logged_in_public_name if logged_in_public_name else '已登录用户' %}
        <div class="comment-identity-chip comment-identity-chip--compact">
            <img src="{{ logged_in_user | avatar_url(40) }}" alt="{{ logged_name }}" loading="lazy">
            <p>以 <strong>{{ logged_name }}</strong> 的身份回复</p>
        </div>
        {% else %}
        <div class="comment-identity__summary comment-identity__summary--compact" data-identity-summary hidden>
            <div class="comment-identity__summary-copy">
                <p>以 <strong data-identity-name>你</strong> 的身份回复</p>
            </div>
            <button type="button" class="comment-identity__edit" data-identity-edit>
                <i class="fas fa-user-pen" aria-hidden="true"></i> 换个马甲
            </button>
        </div>

        <div class="comment-identity comment-identity--compact" data-identity-panel>
            <div class="comment-identity__grid">
                <div>
                    <label class="comment-field__label" for="reply_author_name_{{ parent_id }}">昵称 <span class="comment-field__required">*</span></label>
                    <input
                        type="text"
                        id="reply_author_name_{{ parent_id }}"
                        name="author_name"
                        required
                        maxlength="80"
                        class="comment-field"
                        placeholder="怎么称呼你？"
                        autocomplete="nickname"
                    >
                </div>
                <div>
                    <label class="comment-field__label" for="reply_author_email_{{ parent_id }}">邮箱 <span class="comment-field__required">*</span></label>
                    <input
                        type="email"
                        id="reply_author_email_{{ parent_id }}"
                        name="author_email"
                        required
                        class="comment-field"
                        placeholder="name@example.com"
                        autocomplete="email"
                    >
                </div>
            </div>
            <div class="comment-identity__grid">
                <div>
                    <label class="comment-field__label" for="reply_author_url_{{ parent_id }}">个人网站（可选）</label>
                    <input
                        type="url"
                        id="reply_author_url_{{ parent_id }}"
                        name="author_url"
                        placeholder="https://example.com"
                        class="comment-field"
                        autocomplete="url"
                    >
                </div>
            </div>
        </div>
        {% endif %}

        <div class="comment-editor comment-editor--compact">
            <textarea
                id="reply_content_{{ parent_id }}"
                name="content"
                rows="3"
                required
                maxlength="2000"
                class="comment-editor__input"
                placeholder="想对 @{{ parent_author_name }} 说点什么？"
            ></textarea>
            <div class="comment-editor__foot">
                <div class="comment-editor__kaomoji" aria-label="快捷颜文字">
                    <button type="button" data-kaomoji="(≧▽≦)">(≧▽≦)</button>
                    <button type="button" data-kaomoji="(๑•̀ㅂ•́)و✧">(๑•̀ㅂ•́)و✧</button>
                    <button type="button" data-kaomoji="(¬‿¬)">(¬‿¬)</button>
                </div>
                <span class="comment-editor__count" data-comment-count>0 字</span>
            </div>
        </div>

        {% if captcha_enabled %}
        <div class="comment-captcha" data-captcha-block hidden>
            <div class="comment-captcha__head">
                <span class="comment-captcha__title"><i class="fas fa-shield-halved" aria-hidden="true"></i> 一点点人机验证</span>
                <span class="comment-captcha__hint">偶尔需要证明你是可爱的真人。</span>
            </div>
            <div class="comment-captcha__row">
                <input
                    type="text"
                    id="reply_captcha_{{ parent_id }}"
                    name="captcha"
                    class="comment-field"
                    placeholder="请输入验证码"
                    autocomplete="off"
                >
                <img
                    data-captcha-image
                    data-src="/api/v1/captcha"
                    alt="验证码"
                    title="点击刷新"
                >
            </div>
        </div>
        {% endif %}

        <div class="comment-submit-row comment-submit-row--compact">
            <span class="comment-submit-row__hint">Ctrl / ⌘ + Enter 快速发送</span>
            <div class="comment-submit-row__actions">
                <button type="button" class="comment-cancel" onclick="document.getElementById('comment-form-{{ parent_id }}').innerHTML = ''">取消</button>
                <button type="submit" class="comment-submit comment-submit--compact">
                    <i class="fas fa-paper-plane" data-role="submit-icon" aria-hidden="true"></i>
                    <span>发送回复</span>
                </button>
            </div>
        </div>
    </form>
</div>
