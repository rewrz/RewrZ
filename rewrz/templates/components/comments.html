<!--
评论组件

使用方法：
在文章详情页面中使用：

需要在上下文中提供：
- post: 当前文章对象
- db: 数据库会话 (通过 request.state.db)
- request: Starlette Request 对象
-->

{% if post.allow_comments %}
<div class="comments-section mt-8">
    <h3 class="text-xl font-bold text-gray-800 mb-4">所有评论 ({{ post.comments|length }})</h3>
    
    {% if post.comments %}
    <div id="comments-list" class="space-y-6">
        {% for comment in post.comments if not comment.parent_id %}
            {% include "components/comment_item.html" %}
        {% endfor %}
    </div>
    {% else %}
    <div id="comments-list">
        <p class="text-gray-600">目前还没有评论。成为第一个评论者吧！</p>
    </div>
    {% endif %}
    
    <div class="mt-8">
        <h3 class="text-xl font-bold text-gray-800 mb-4">发表评论</h3>
        <!-- 通过HTMX获取评论表单，确保form_timestamp等变量正确传递 -->
        <div hx-get="/api/v1/comments/form/{{ post.id }}" hx-trigger="load"></div>
    </div>
</div>
{% endif %}
