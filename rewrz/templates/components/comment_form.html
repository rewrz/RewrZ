<!-- 评论表单组件 -->
<div class="comment-form bg-white p-6 rounded-lg border border-gray-200">
    <h3 class="text-lg font-semibold text-gray-900 mb-4">发表评论</h3>
    
    <form hx-post="/api/v1/comments/{{ post.id }}" 
          hx-target="#comments-list" 
          hx-swap="beforeend"
          hx-on="htmx:afterRequest: this.reset()">
        
        <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
        <input type="hidden" name="ft" value="{{ form_timestamp_token }}">

        <!-- HoneyPot 字段：对人类不可见，机器人常会误填 -->
        <div class="absolute -left-[9999px] top-auto h-px w-px overflow-hidden" aria-hidden="true">
            <label for="hp-field-{{ post.id }}">请勿填写</label>
            <input
                type="text"
                id="hp-field-{{ post.id }}"
                name="hp_field"
                tabindex="-1"
                autocomplete="off"
                value=""
            >
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <!-- 姓名输入框，带头像预览 -->
            <div>
                <label for="author_name" class="block text-sm font-medium text-gray-700 mb-1">姓名 *</label>
                <div class="flex items-center space-x-3">
                    <!-- 头像预览 -->
                    <div class="flex-shrink-0">
                        <img id="avatar-preview" 
                             class="w-10 h-10 rounded-full border-2 border-gray-200" 
                             src="/static/images/default-avatar.png" 
                             alt="头像预览"
                             loading="lazy">
                    </div>
                    <div class="flex-1">
                        <input type="text" 
                               id="author_name" 
                               name="author_name" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                               required>
                    </div>
                </div>
            </div>
            
            <!-- 邮箱输入框 -->
            <div>
                <label for="author_email" class="block text-sm font-medium text-gray-700 mb-1">邮箱 *</label>
                <input type="email" 
                       id="author_email" 
                       name="author_email" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                       required
                       onchange="updateAvatarPreview(this.value)">
                <p class="text-xs text-gray-500 mt-1">邮箱不会被公开，用于显示Gravatar头像</p>
            </div>
        </div>
        
        <!-- 网站输入框 -->
        <div class="mb-4">
            <label for="author_url" class="block text-sm font-medium text-gray-700 mb-1">网站（可选）</label>
            <input type="url" 
                   id="author_url" 
                   name="author_url" 
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                   placeholder="https://example.com">
        </div>
        
        <!-- 评论内容 -->
        <div class="mb-4">
            <label for="content" class="block text-sm font-medium text-gray-700 mb-1">评论内容 *</label>
            <textarea id="content" 
                      name="content" 
                      rows="4" 
                      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                      required
                      placeholder="支持Markdown格式..."></textarea>
            <div class="text-xs text-gray-500 mt-1 flex justify-between">
                <span>支持Markdown语法，允许使用基本HTML标签</span>
                <span>请文明发言，遵守相关法律法规</span>
            </div>
        </div>
        
        <!-- 验证码（如果需要） -->
        {% if captcha_enabled %}
        <div class="mb-4">
            <label for="captcha" class="block text-sm font-medium text-gray-700 mb-1">验证码</label>
            <div class="flex items-center space-x-3">
                <input type="text" 
                       id="captcha" 
                       name="captcha" 
                       class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                       placeholder="请输入验证码">
                <div class="captcha-image">
                    <img src="/api/v1/captcha" alt="Captcha" onclick="this.src='/api/v1/captcha?t=' + new Date().getTime()">
                </div>
            </div>
        </div>
        {% endif %}
        
        <!-- 提交按钮 -->
        <div class="flex justify-between items-center">
            <div class="text-sm text-gray-600">
                <span class="text-red-500">*</span> 必填项
            </div>
            <button type="submit" 
                    class="px-6 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-50"
                    hx-indicator="#submit-spinner">
                <span id="submit-spinner" class="htmx-indicator">
                    <svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </span>
                发表评论
            </button>
        </div>
    </form>
</div>

<!-- 引入crypto-js用于MD5计算 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<!-- JavaScript for avatar preview -->
<script>
function updateAvatarPreview(email) {
    if (!email) {
        document.getElementById('avatar-preview').src = '/static/images/default-avatar.png';
        return;
    }
    
    // 生成Gravatar URL
    const emailHash = CryptoJS.MD5(email.toLowerCase().trim()).toString();
    const gravatarUrl = `https://www.gravatar.com/avatar/${emailHash}?s=40&d=identicon&r=g`;
    
    document.getElementById('avatar-preview').src = gravatarUrl;
}

// 页面加载时初始化头像预览
document.addEventListener('DOMContentLoaded', function() {
    const emailInput = document.getElementById('author_email');
    if (emailInput && emailInput.value) {
        updateAvatarPreview(emailInput.value);
    }
});
</script>
