{# 内容分级标记：列表卡片要让读者在点击前就知道内容性质 #}
{% set badge_rating = rating if rating is defined and rating else 'general' %}
{% if badge_rating == 'nsfw' %}
<span class="content-rating-badge is-nsfw" aria-label="内容分级：NSFW">
    <i class="fas fa-exclamation-triangle" aria-hidden="true"></i>NSFW
</span>
{% elif badge_rating == 'sensitive' %}
<span class="content-rating-badge" aria-label="内容分级：敏感">
    <i class="fas fa-exclamation-circle" aria-hidden="true"></i>敏感
</span>
{% endif %}
